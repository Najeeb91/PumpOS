<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>PumpOS</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.app{max-width:430px;min-height:100vh;margin:auto;background:#f8fafc;padding-bottom:88px}.top{height:72px;background:#0b1220;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}.brand{font-size:21px;font-weight:850}.role{font-size:12px;color:#b9c2d0;margin-top:2px}.content{padding:18px}.eyebrow{font-size:12px;color:#667085;margin-bottom:5px}.title{font-size:27px;line-height:1.08;margin:0 0 15px;font-weight:850;letter-spacing:-.7px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #1018280a}.hero{background:#0b1220;color:#fff;border:0}.hero .muted,.hero .label{color:#b9c2d0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:21px;font-weight:850}.label{font-size:12px;color:#667085}.muted{font-size:13px;color:#667085}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;background:#e8f7ee;color:#087443}.badge.warn{background:#fff4e5;color:#a15c00}.badge.danger{background:#ffe8e8;color:#b42318}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:14px;min-height:48px;cursor:pointer}.primary{background:#0b1220;color:#fff}.secondary{background:#eef2f6;color:#101828}.dangerBtn{background:#fff0f0;color:#b42318}.btn+.btn{margin-top:9px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#344054}input,select{width:100%;height:48px;border:1px solid #d0d5dd;border-radius:13px;padding:0 13px;background:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:#0b1220}.sectionTitle{font-size:15px;font-weight:850;margin:18px 0 10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:92px;border:1px solid #e6eaf0;border-radius:17px;background:#fff;text-align:left;padding:14px;font-weight:800;box-shadow:0 2px 10px #10182808}.quick small{display:block;color:#667085;font-weight:500;margin-top:5px;line-height:1.25}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:76px;background:#fff;border-top:1px solid #e4e7ec;display:grid;grid-template-columns:repeat(4,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;font-size:10px;color:#667085;font-weight:750}.nav button.active{color:#0b1220}.nav span{display:block;font-size:19px;margin-bottom:2px}.login{min-height:100vh;display:flex;align-items:center;padding:24px}.loginbox{width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 40px #10182818}.logo{font-size:34px;font-weight:900;margin-bottom:8px}.sub{color:#667085;margin-bottom:24px}.small{font-size:11px;color:#98a2b3}.item{padding:13px;border:1px solid #eaecf0;border-radius:14px;background:#fff;margin-bottom:8px}.empty{text-align:center;padding:28px 12px;color:#667085}.back{border:0;background:none;font-weight:800;padding:0 0 12px;font-size:14px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:#101828;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;max-width:90%;display:none}.modal{position:fixed;inset:0;background:#10182866;z-index:10;display:flex;align-items:flex-end}.sheet{background:#f8fafc;border-radius:22px 22px 0 0;width:100%;max-width:430px;margin:auto;max-height:90vh;overflow:auto;padding:18px}.hide{display:none!important}.amount{font-size:28px;font-weight:900}.choice{display:flex;gap:8px}.choice button{flex:1;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:12px;font-weight:750}.choice button.active{background:#0b1220;color:#fff;border-color:#0b1220}.stickyCta{position:sticky;bottom:0;background:#f8fafc;padding-top:8px}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const S={token:localStorage.getItem('pumpos_token'),user:JSON.parse(localStorage.getItem('pumpos_user')||'null'),boot:null,dash:null,rates:[],setup:null,shift:null,shiftDetail:null,screen:'home',quick:null,manager:null,owner:null};
const root=document.getElementById('root');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=x=>Number(x||0);const money=x=>'₹'+num(x).toLocaleString('en-IN',{maximumFractionDigits:2});const litres=x=>num(x).toLocaleString('en-IN',{maximumFractionDigits:3})+' L';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;const r=await fetch(path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request Failed');return d}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({mobile:mobile.value,password:password.value})});S.token=d.token;S.user=d.user;localStorage.setItem('pumpos_token',S.token);localStorage.setItem('pumpos_user',JSON.stringify(S.user));await boot()}catch(e){toast(e.message)}}
async function boot(){try{S.boot=await api('/api/bootstrap');S.shift=S.boot.shift;if(S.user.role==='MANAGER'){await managerOverview();}else if(S.user.role==='OWNER'){await ownerOverview();}else{S.rates=await api('/api/salesman/rates').catch(()=>[]);await refreshShift();}render()}catch(e){localStorage.clear();S.token=null;S.user=null;render();toast(e.message)}}
async function loginView(){try{const st=await api('/api/setup/status');if(!st.initialized){setupView();return}}catch(e){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">PumpOS</div><div class="sub">Database Connection Is Required</div><div class="card"><b>PumpOS Is Not Connected Yet.</b><div class="muted" style="margin-top:7px">Configure DATABASE_URL And JWT_SECRET, Then Restart The Server.</div></div></div></div>`;return}root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">PumpOS</div><div class="sub">Simple, Controlled, Station Operations</div><div class="field"><label>Mobile</label><input id="mobile" inputmode="numeric" placeholder="Mobile"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Password"></div><button class="btn primary" onclick="login()">Login</button><div class="small" style="margin-top:14px">First Install? PumpOS Will Take You Through Station Setup Automatically.</div></div></div>`}
function setupView(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">PumpOS</div><div class="sub">Set Up Your Station</div><div class="card"><b>Step 1 · Owner</b><div class="muted" style="margin-top:5px">Owner Is Mandatory. Team Members Can Be Added Later.</div><div class="field" style="margin-top:13px"><label>Owner Name</label><input id="obOwner"></div><div class="field"><label>Owner Mobile</label><input id="obMobile" inputmode="tel"></div><div class="field"><label>Owner Password</label><input id="obPass" type="password" placeholder="Minimum 6 Characters"></div></div><div class="card"><b>Step 2 · Station</b><div class="field" style="margin-top:13px"><label>Station Name</label><input id="obStation"></div></div><div class="card"><b>Step 3 · Products</b><div class="field" style="margin-top:13px"><label>Product 1</label><input id="obP1" value="MS"></div><div class="field"><label>Product 2</label><input id="obP2" value="HSD"></div></div><div class="card"><b>Step 4 · Tanks</b><div class="field" style="margin-top:13px"><label>MS Tank Capacity (L)</label><input id="obT1" type="number" value="20000"></div><div class="field"><label>HSD Tank Capacity (L)</label><input id="obT2" type="number" value="20000"></div></div><div class="card"><b>Step 5 · Machine & Nozzles</b><div class="field" style="margin-top:13px"><label>Machine Name</label><input id="obM1" value="Machine 1"></div><div class="muted">One MS And One HSD Nozzle Will Be Created.</div></div><button class="btn primary" onclick="completeOnboarding()">Create Station & Open Owner Dashboard</button><div class="small" style="margin-top:12px">Manager And Salesman Are Optional And Can Be Added Later.</div></div></div>`}
async function completeOnboarding(){try{const payload={ownerName:obOwner.value.trim(),ownerMobile:obMobile.value.trim(),ownerPassword:obPass.value,stationName:obStation.value.trim(),products:[{key:'MS',code:'MS',name:obP1.value.trim()||'MS'},{key:'HSD',code:'HSD',name:obP2.value.trim()||'HSD'}],tanks:[{name:'Tank 1',productKey:'MS',capacity:num(obT1.value),openingStock:0,openingDip:0},{name:'Tank 2',productKey:'HSD',capacity:num(obT2.value),openingStock:0,openingDip:0}],machines:[{code:'M1',name:obM1.value.trim()||'Machine 1',nozzles:[{code:'N1',productKey:'MS',openingMeter:0},{code:'N2',productKey:'HSD',openingMeter:0}]}]};const d=await api('/api/setup/onboard',{method:'POST',body:JSON.stringify(payload)});S.token=d.token;S.user=d.user;S.boot=null;localStorage.setItem('pumpos_token',S.token);localStorage.setItem('pumpos_user',JSON.stringify(S.user));toast('Station Created');await boot()}catch(e){toast(e.message)}}
function header(){return `<div class="top"><div><div class="brand">PumpOS</div><div class="role">${esc(S.user.name)} · ${esc(S.user.role)}</div></div><button onclick="logout()" style="background:none;border:0;color:#fff;font-weight:800">Exit</button></div>`}
function nav(){let a=[['home','⌂','Home'],['shift','▣','Shift Status'],['close','✓','Close Shift'],['profile','◉','Profile']];if(S.quick){const m={credit:[['credit','♙','Credit Customers'],['summary','▤','Shift Summary'],['digital','₹','Digital Transactions']],summary:[['credit','♙','Credit Customers'],['digital','₹','Digital Transactions'],['ops','⚙','Operations']],digital:[['credit','♙','Credit Customers'],['summary','▤','Shift Summary'],['ops','⚙','Operations']],ops:[['credit','♙','Credit Customers'],['summary','▤','Shift Summary'],['digital','₹','Digital Transactions']]};a=[['home','⌂','Home'],...(m[S.quick]||[])];}return `<div class="nav">${a.map(x=>`<button class="${S.screen===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
async function go(x){S.screen=x;if(x==='home'||x==='mhome'||x==='ohome')S.quick=null;if(['shift','close'].includes(x))await refreshShift();if(x.startsWith('m'))await managerOverview();if(x.startsWith('o'))await ownerOverview();render()}
async function refreshShift(){try{S.dash=await api('/api/dashboard');S.shift=S.dash.shift||null;S.shiftDetail=S.shift?await api('/api/salesman/shift/'+S.shift.id):null}catch(e){toast(e.message)}}
function countdown(){if(!S.shift?.ends_at)return 'End Time Not Set';const ms=new Date(S.shift.ends_at)-Date.now();if(ms<=0)return 'ENDING NOW';const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return `Ends In ${h?`${h}h `:''}${m}m`}
function home(){const sh=S.shift,d=S.dash||{};return `<div class="content"><div class="eyebrow">${esc(S.boot?.station?.name||'Station')}</div><h1 class="title">Welcome, Salesman</h1>${sh?`<div class="card hero"><div class="row"><div><div class="label">Current Shift</div><div style="font-size:22px;font-weight:850">${esc(sh.shift_type)} · OPEN</div></div><span class="badge">LIVE</span></div><div class="muted" style="margin-top:10px">${new Date(sh.starts_at).toLocaleString()}</div><div style="font-size:15px;font-weight:800;margin-top:9px">${countdown()}</div><div class="muted" style="margin-top:6px">${S.shiftDetail?.assignment?.machine_code?'Machine '+esc(S.shiftDetail.assignment.machine_code):'Machine Not Assigned'}</div></div>`:`<div class="card"><b>Shift Not Started</b><div class="muted" style="margin:7px 0 13px">Start Your Shift Before Taking Sales.</div><button class="btn primary" onclick="startShift()">Start Shift</button></div>`}<div class="sectionTitle">Quick Actions</div><div class="quick"><button onclick="openQuick('credit')">Credit Customers<small>Fuel On Account & Outstanding</small></button><button onclick="openQuick('summary')">Shift Summary<small>Review Sales, Meters & Cash</small></button><button onclick="openQuick('digital')">Digital Transactions<small>UPI, Card & Bank Collection</small></button><button onclick="openQuick('ops')">Operations<small>NAT, Expenses & Other Work</small></button></div>${sh&&d.pending?.sales_pending?`<div class="card" style="margin-top:12px"><div class="row"><b>Pending Verification</b><span class="badge warn">${d.pending.sales_pending}</span></div><div class="muted" style="margin-top:6px">Sales Awaiting Manager Verification.</div></div>`:''}</div>`}
async function startShift(){try{const ends=new Date(Date.now()+12*3600000).toISOString();S.shift=await api('/api/shifts',{method:'POST',body:JSON.stringify({shiftType:'DAY',openingCash:0,startsAt:new Date().toISOString(),endsAt:ends})});S.setup=await api('/api/salesman/setup');shiftSetup()}catch(e){toast(e.message)}}
function shiftSetup(){const machines=S.setup.machines||[];const nz=S.setup.nozzles||[];if(!machines.length)return toast('No Active Machine Configured');renderModal('Start Shift',`<div class="field"><label>Machine</label><select id="machine" onchange="renderOpeningMeters()">${machines.map(m=>`<option value="${m.id}">${esc(m.code)} · ${esc(m.name)}</option>`).join('')}</select></div><div id="openingMeterArea"></div><button class="btn primary" onclick="saveShiftSetup()">Verify & Start</button>`);renderOpeningMeters()}
function renderOpeningMeters(){const mid=machine?.value;const nz=(S.setup.nozzles||[]).filter(n=>n.machine_id===mid);openingMeterArea.innerHTML=`<div class="sectionTitle">Opening Meters</div>${nz.map(n=>`<div class="item"><div class="row"><b>${esc(n.code)} · ${esc(n.product_code)}</b><span class="muted">Last ${litres(n.opening_meter)}</span></div><div class="field" style="margin-top:9px"><label>Opening Meter</label><input class="openMeter" data-nozzle="${n.id}" type="number" step="0.001" value="${n.opening_meter}"></div></div>`).join('')||'<div class="empty">No Nozzles On This Machine</div>'}`}
async function saveShiftSetup(){try{const rs=[...document.querySelectorAll('.openMeter')].map(x=>({nozzleId:x.dataset.nozzle,openingMeter:num(x.value)}));if(!rs.length)throw Error('Opening meter readings are required');await api('/api/salesman/assign',{method:'POST',body:JSON.stringify({shiftId:S.shift.id,machineId:machine.value,nozzleReadings:rs})});toast('Shift Started · Attendance Marked Present');closeModal();await refreshShift();render()}catch(e){toast(e.message)}}
function shift(){const x=S.shiftDetail;if(!S.shift)return `<div class="content"><h1 class="title">Shift Status</h1><div class="card"><b>Shift Not Started</b><div class="muted" style="margin:7px 0 13px">Start Your Shift To Begin Operations.</div><button class="btn primary" onclick="startShift()">Start Shift</button></div></div>`;return `<div class="content"><h1 class="title">Shift Status</h1><div class="card hero"><div class="row"><div><div class="label">Current Shift</div><div style="font-size:22px;font-weight:850">${esc(S.shift.shift_type)} · OPEN</div></div><span class="badge">LIVE</span></div><div class="muted" style="margin-top:9px">${countdown()}</div></div><div class="card"><div class="row"><b>Machine</b><span>${esc(x?.assignment?.machine_code||'Not Assigned')}</span></div><div class="sectionTitle">Nozzle Meters</div>${(x?.nozzles||[]).map(n=>`<div class="item"><div class="row"><b>${esc(n.nozzle_code)}</b><b>${litres(n.opening_meter)}</b></div><div class="muted">${esc(n.product_code)} · Opening Meter</div></div>`).join('')||'<div class="empty">No Meter Readings</div>'}</div><div class="card"><div class="row"><b>Attendance</b><span class="badge">${esc(x?.attendance?.status||'PRESENT')}</span></div><div class="muted" style="margin-top:6px">Duty Days: ${num(x?.attendance?.duty_days)||1}</div></div><div class="card"><button class="btn primary" onclick="saleForm()">New Sale</button><button class="btn secondary" onclick="salesList()">Shift Sales</button></div></div>`}
function closeShift(){if(!S.shift)return `<div class="content"><h1 class="title">Close Shift</h1><div class="card"><b>No Open Shift</b></div></div>`;const unlock=!S.shift.ends_at||Date.now()>=new Date(S.shift.ends_at)-15*60000;return `<div class="content"><h1 class="title">Close Shift</h1><div class="card"><div class="row"><b>Close Shift</b><span class="badge ${unlock?'':'warn'}">${unlock?'UNLOCKED':'LOCKED'}</span></div><div class="muted" style="margin-top:8px">${unlock?'Final 15-Minute Window Is Open.':'Close Shift Becomes Available In The Final 15 Minutes.'}</div></div>${unlock?`<div class="card"><div class="sectionTitle">Actual Cash</div><div class="grid">${[['2000','₹2,000'],['500','₹500'],['200','₹200'],['100','₹100'],['50','₹50'],['20','₹20'],['10','₹10'],['5','₹5'],['2','₹2'],['1','₹1']].map(x=>`<div class="field"><label>${x[1]}</label><input class="denom" data-value="${x[0]}" type="number" min="0" step="1" value="0"></div>`).join('')}</div><div class="field"><label>Coins Value</label><input id="coins" type="number" min="0" step="0.01" value="0"></div><div class="card"><div class="row"><b>Counted Cash</b><b id="countedCash">₹0</b></div><div class="muted">Manager Reconciliation Must Be Reconciled Before Close.</div></div><div class="sectionTitle">Closing Meters</div>${(S.shiftDetail?.nozzles||[]).map(n=>`<div class="field"><label>${esc(n.nozzle_code)} · ${esc(n.product_code)}</label><input class="closeMeter" data-nozzle="${n.nozzle_id}" type="number" step="0.001" placeholder="Closing Meter"></div>`).join('')}<button class="btn primary" onclick="closeShiftNow()">Close Shift</button></div>`:''}</div>`}
function updateCount(){let t=num(coins?.value);document.querySelectorAll('.denom').forEach(x=>t+=num(x.value)*num(x.dataset.value));if(countedCash)countedCash.textContent=money(t)}
async function closeShiftNow(){try{const d={};document.querySelectorAll('.denom').forEach(x=>d[x.dataset.value]=num(x.value));d.coins=num(coins?.value);const rs=[...document.querySelectorAll('.closeMeter')].map(x=>({nozzleId:x.dataset.nozzle,closingMeter:num(x.value)}));if(rs.some(x=>x.closingMeter<=0))throw Error('All Closing Meters Are Required');await api('/api/shifts/'+S.shift.id+'/close',{method:'POST',body:JSON.stringify({denominations:d,nozzleReadings:rs})});toast('Shift Closed');S.shift=null;S.shiftDetail=null;await refreshShift();render()}catch(e){toast(e.message)}}
function openQuick(q){S.quick=q;S.screen=q;render()}
function quickScreen(){if(S.quick==='credit')return creditScreen();if(S.quick==='summary')return summaryScreen();if(S.quick==='digital')return digitalScreen();return opsScreen()}
function creditScreen(){return `<div class="content"><h1 class="title">Credit Customers</h1><div class="field"><input id="customerSearch" placeholder="Search Customer" oninput="filterCustomers()"></div><div class="card"><button class="btn primary" onclick="creditSale()">New Credit Sale</button><button class="btn secondary" onclick="addCustomer()">Add Customer</button></div><div id="customerList"><div class="empty">Loading Customers…</div></div></div>`}
function filterCustomers(){const q=(customerSearch.value||'').toLowerCase();document.querySelectorAll('[data-customer]').forEach(e=>e.style.display=e.dataset.customer.toLowerCase().includes(q)?'block':'none')}
async function loadCustomers(){try{S.setup=S.setup||await api('/api/salesman/setup');const c=S.setup.customers||[];const e=document.getElementById('customerList');if(e)e.innerHTML=c.map(x=>`<div class="item" data-customer="${esc(x.name+' '+(x.phone||''))}" onclick="customerOverview('${x.id}')"><div class="row"><b>${esc(x.name)}</b><span class="badge ${num(x.previous_outstanding)>0?'warn':''}">${money(x.previous_outstanding)}</span></div><div class="muted">Previous Outstanding · Tap For Overview</div></div>`).join('')||'<div class="empty">No Credit Customers</div>'}catch(e){toast(e.message)}}
function customerOverview(id){const c=S.setup.customers.find(x=>x.id===id);renderModal('Customer Overview',`<div class="card"><div class="label">Customer</div><div class="amount" style="font-size:22px">${esc(c.name)}</div><div class="muted">${esc(c.phone||'No Phone')}</div></div><div class="item"><div class="row"><b>Previous Outstanding</b><b>${money(c.previous_outstanding)}</b></div></div><button class="btn primary" onclick="creditSale('${c.id}')">New Credit Sale</button>`)}
function addCustomer(){renderModal('Add Customer',`<div class="field"><label>Customer Name</label><input id="newCustName"></div><div class="field"><label>Phone</label><input id="newCustPhone" inputmode="tel"></div><button class="btn primary" onclick="saveCustomer()">Save Customer</button>`)}
async function saveCustomer(){try{await api('/api/credit-customers',{method:'POST',body:JSON.stringify({name:newCustName.value.trim(),phone:newCustPhone.value.trim()})});toast('Customer Added');closeModal();S.setup=await api('/api/salesman/setup');loadCustomers()}catch(e){toast(e.message)}}
function creditSale(customerId){const c=S.setup?.customers||[];renderModal('Credit Sale',`${customerId?`<div class="item"><b>${esc(c.find(x=>x.id===customerId)?.name||'Customer')}</b></div>`:''}<div class="field"><label>Customer</label><select id="creditCustomer">${c.map(x=>`<option value="${x.id}" ${x.id===customerId?'selected':''}>${esc(x.name)} · Outstanding ${money(x.previous_outstanding)}</option>`).join('')}</select></div>${saleFields('CREDIT')}<button class="btn primary" onclick="reviewCreditSale()">Review Sale</button>`);setTimeout(syncRate,0)}
function saleFields(mode='CASH'){return `<div class="field"><label>Fuel</label><select id="saleProduct" onchange="syncSaleNozzles()">${(S.rates||[]).map(p=>`<option value="${p.id}" data-rate="${p.selling_rate}">${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Nozzle</label><select id="saleNozzle" onchange="syncRate()"></select></div><div class="field"><label>Amount</label><input id="saleAmount" type="number" step="0.01" oninput="calcQty()"></div><div class="field"><label>Rate (₹/L)</label><input id="saleRate" readonly></div><div class="field"><label>Quantity (L)</label><input id="saleQty" type="number" step="0.001" oninput="calcAmount()"></div>${mode==='CASH'?`<div class="field"><label>Payment Mode</label><select id="saleMode"><option>CASH</option><option>UPI</option><option>CARD</option><option>BANK</option><option>FLEET</option><option>CREDIT</option></select></div>`:''}<div id="fleetFields" class="hide"><div class="field"><label>Fleet / Company</label><input id="fleetCompany"></div></div><div class="field"><label>Vehicle Number</label><input id="saleVehicle" placeholder="Optional"></div>`}
function syncSaleNozzles(){const p=saleProduct?.value;const ns=(S.setup?.nozzles||[]).filter(n=>n.product_id===p&&(!S.shiftDetail?.assignment?.machine_id||n.machine_id===S.shiftDetail.assignment.machine_id));saleNozzle.innerHTML=ns.map(n=>`<option value="${n.id}" data-code="${n.code}">${esc(n.machine_code)} · ${esc(n.code)}</option>`).join('');syncRate()}
function syncRate(){const o=saleProduct?.options[saleProduct.selectedIndex];if(saleRate)saleRate.value=num(o?.dataset.rate).toFixed(2);calcAmount()}
function calcQty(){const r=num(saleRate?.value);if(r&&saleQty)saleQty.value=(num(saleAmount.value)/r).toFixed(3)}function calcAmount(){const r=num(saleRate?.value);if(r&&saleAmount)saleAmount.value=(num(saleQty.value)*r).toFixed(2)}

function reviewSale(){const p=saleProduct.options[saleProduct.selectedIndex];if(num(saleAmount.value)<=0||num(saleQty.value)<=0) return toast('Enter Sale Amount Or Quantity');renderModal('Review Sale',`<div class="card"><div class="label">Sale Amount</div><div class="amount">${money(saleAmount.value)}</div><div class="muted">${esc(p.text)} · ${litres(saleQty.value)} · ${money(saleRate.value)}/L</div><div class="muted">${esc(saleMode?.value||'CASH')} · ${esc(saleVehicle?.value||'No Vehicle')}</div></div><button class="btn primary" onclick="submitSale()">Confirm Sale</button>`)}

async function saveRecon(id){try{await api('/api/reconciliation/'+id+'/decide',{method:'POST',body:JSON.stringify({decision:reconDecision.value,actualCash:num(reconCash.value),reason:reconReason.value})});toast('Reconciliation Updated');closeModal();await managerOverview();render()}catch(e){toast(e.message)}}
async function reconDetail(id){const x=await api('/api/manager/shift/'+id);const r=x.reconciliation;renderModal('Reconciliation Control',`<div class="card"><div class="row"><b>Status</b><span class="badge ${r?.status==='RECONCILED'?'':'warn'}">${r?.status||'PENDING'}</span></div><div class="row" style="margin-top:10px"><span>Expected Cash</span><b>${money(r?.expected_cash??x.expectedCash)}</b></div><div class="row" style="margin-top:8px"><span>Actual Cash</span><b>${money(r?.actual_cash)}</b></div><div class="row" style="margin-top:8px"><span>Variance</span><b>${money(r?.cash_variance)}</b></div></div>${r?.status!=='RECONCILED'?`<button class="btn primary" onclick="reconcileForm('${id}',${x.expectedCash})">Resolve / Decide</button>`:'<div class="muted">Reconciled. Shift May Proceed To Close When Other Controls Are Complete.</div>'}`)}
async function collectionsManager(){await managerOverview();const a=S.manager?.collections||[],b=S.manager?.bank||[];renderModal('Collections & Banking',`${b.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><b>${money(x.balance)}</b></div><div class="muted">${esc(x.account_mask||'')}</div></div>`).join('')}<div class="sectionTitle">Verified Digital Collections</div>${a.filter(x=>['UPI','CARD','BANK'].includes(x.payment_mode)).map(x=>`<div class="item"><div class="row"><b>${esc(x.payment_mode)} · ${money(x.amount)}</b><span class="badge ${x.settlement_status==='LOCKED'?'':'warn'}">${esc(x.settlement_status)}</span></div>${x.settlement_status==='VERIFIED'?`<button class="btn primary" style="margin-top:9px" onclick="settleDigital('${x.id}')">Settle To Bank</button>`:''}</div>`).join('')||'<div class="empty">No Verified Digital Collections</div>'}<div class="muted">Bank Balance Changes Only On Verified Settlement.</div>`)}
async function settleDigital(id){const b=S.manager?.bank?.[0];if(!b)return toast('Add A Bank Account First');try{await api('/api/collections/'+id+'/settle-bank',{method:'POST',body:JSON.stringify({bankAccountId:b.id,reference:'PumpOS Digital Settlement'})});toast('Bank Balance Updated');await managerOverview();collectionsManager()}catch(e){toast(e.message)}}
async function deliveriesManager(){await managerOverview();const a=S.manager?.deliveries||[];renderModal('Deliveries',a.map(x=>`<div class="item"><div class="row"><b>${esc(x.product_code)} · ${esc(x.tank_name)}</b><span class="badge ${num(x.pending_recovery_l)>0?'warn':''}">${num(x.pending_recovery_l)>0?'RECOVERY PENDING':'RECOVERED'}</span></div><div class="muted">Invoice ${litres(x.invoice_qty_l)} · Shortage ${litres(x.shortage_l)} · Net ${litres(x.net_received_l)}</div>${num(x.pending_recovery_l)>0?`<button class="btn primary" style="margin-top:9px" onclick="recoverDelivery('${x.id}',${x.pending_recovery_l})">Recover Previous Shortage</button>`:''}</div>`).join('')||'<div class="empty">No Deliveries</div>')}
async function recoverDelivery(id,pending){renderModal('Recover Previous Shortage',`<div class="card"><div class="label">Pending Recovery</div><div class="amount">${litres(pending)}</div></div><div class="field"><label>Recovery Quantity (L)</label><input id="recoverQty" type="number" step="0.001" max="${pending}" value="${pending}"></div><div class="field"><label>Reason / Reference</label><input id="recoverReason"></div><button class="btn primary" onclick="saveRecovery('${id}')">Confirm Recovery</button>`)}
async function saveRecovery(id){try{await api('/api/deliveries/'+id+'/recover',{method:'POST',body:JSON.stringify({quantityL:num(recoverQty.value),reason:recoverReason.value})});toast('Recovery Recorded');await managerOverview();deliveriesManager()}catch(e){toast(e.message)}}
function managerReports(){return `<div class="content"><h1 class="title">Reports</h1><div class="quick"><button onclick="pnlManager()">Daily Business Summary<small>Sales, Margin, Expenses & Result</small></button><button onclick="reconReport()">Reconciliation History<small>Cash & Control Decisions</small></button><button onclick="bankReport()">Banking & Collections<small>Verified Balance & Settlements</small></button><button onclick="auditReport()">Audit Trail<small>Who, What, When & Why</small></button></div></div>`}
async function pnlManager(){const p=await api('/api/pnl');renderModal('Business Summary',`<div class="item"><div class="row"><b>Revenue</b><b>${money(p.revenue)}</b></div></div><div class="item"><div class="row"><b>Fuel Margin</b><b>${money(p.fuel_margin)}</b></div></div><div class="item"><div class="row"><b>Actual Operating Expenses</b><b>${money(p.expenses)}</b></div></div><div class="card hero"><div class="label">Operating Result</div><div class="amount">${money(p.netOperatingProfit)}</div><div class="muted">Actual Realized Fuel Margin − Actual Operating Expenses</div></div>`)}
async function reconReport(){await managerOverview();renderModal('Reconciliation History',(S.manager.reconciliations||[]).map(r=>`<div class="item" onclick="reconDetail('${r.shift_id}')"><div class="row"><b>${new Date(r.starts_at).toLocaleString()}</b><span class="badge ${r.status==='RECONCILED'?'':'warn'}">${esc(r.status)}</span></div><div class="muted">Expected ${money(r.expected_cash)} · Actual ${money(r.actual_cash)} · Variance ${money(r.cash_variance)}</div></div>`).join('')||'<div class="empty">No Reconciliation Records</div>')}
async function bankReport(){await managerOverview();renderModal('Banking Summary',(S.manager.bank||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><b>${money(x.balance)}</b></div><div class="muted">${esc(x.account_mask||'')}</div></div>`).join('')||'<div class="empty">No Bank Accounts</div>')}
async function configuration(){try{const x=await api('/api/configuration');renderModal('Station Configuration',`<div class="sectionTitle">Products</div>${x.products.map(p=>`<div class="item"><div class="row"><b>${esc(p.code)}</b><span>${esc(p.name)}</span></div></div>`).join('')}<button class="btn secondary" onclick="addConfigProduct()">Add Product</button><div class="sectionTitle">Tanks</div>${x.tanks.map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><span>${litres(t.capacity_l)}</span></div><div class="muted">${esc(t.product_code)} · Opening Stock ${litres(t.opening_stock_l)} · Opening Dip ${litres(t.opening_dip_l)}</div></div>`).join('')}<button class="btn secondary" onclick="addConfigTank()">Add Tank</button><div class="sectionTitle">Machines & Nozzles</div>${x.machines.map(m=>`<div class="item"><b>${esc(m.code)} · ${esc(m.name)}</b>${x.nozzles.filter(n=>n.machine_id===m.id).map(n=>`<div class="muted" style="margin-top:5px">${esc(n.code)} · ${esc(n.product_code)} · Opening ${litres(n.opening_meter)}</div>`).join('')}</div>`).join('')}<button class="btn secondary" onclick="addConfigMachine()">Add Machine</button>`)}catch(e){toast(e.message)}}
function addConfigProduct(){renderModal('Add Product',`<div class="field"><label>Product Code</label><input id="cpCode" placeholder="MS"></div><div class="field"><label>Product Name</label><input id="cpName"></div><button class="btn primary" onclick="saveConfigProduct()">Save Product</button>`)}
async function saveConfigProduct(){try{await api('/api/configuration/product',{method:'POST',body:JSON.stringify({code:cpCode.value,name:cpName.value})});toast('Product Saved');configuration()}catch(e){toast(e.message)}}
function addConfigTank(){const p=S.boot?.products||[];renderModal('Add Tank',`<div class="field"><label>Product</label><select id="ctProduct">${p.map(x=>`<option value="${x.id}">${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Tank Name</label><input id="ctName"></div><div class="field"><label>Capacity (L)</label><input id="ctCap" type="number"></div><div class="field"><label>Opening Stock (L)</label><input id="ctStock" type="number" value="0"></div><div class="field"><label>Opening Dip (L)</label><input id="ctDip" type="number" value="0"></div><button class="btn primary" onclick="saveConfigTank()">Save Tank</button>`)}
async function saveConfigTank(){try{await api('/api/configuration/tank',{method:'POST',body:JSON.stringify({productId:ctProduct.value,name:ctName.value,capacity:num(ctCap.value),openingStock:num(ctStock.value),openingDip:num(ctDip.value)})});toast('Tank Saved');configuration()}catch(e){toast(e.message)}}
function addConfigMachine(){const p=S.boot?.products||[];renderModal('Add Machine',`<div class="field"><label>Machine Name</label><input id="cmName"></div><div class="field"><label>Nozzle 1 Code</label><input id="cmN1" value="N1"></div><div class="field"><label>Nozzle 1 Product</label><select id="cmP1">${p.map(x=>`<option value="${x.id}">${esc(x.code)}</option>`).join('')}</select></div><div class="field"><label>Nozzle 2 Code</label><input id="cmN2" value="N2"></div><div class="field"><label>Nozzle 2 Product</label><select id="cmP2">${p.map(x=>`<option value="${x.id}">${esc(x.code)}</option>`).join('')}</select></div><button class="btn primary" onclick="saveConfigMachine()">Save Machine</button>`)}
async function saveConfigMachine(){try{await api('/api/configuration/machine',{method:'POST',body:JSON.stringify({name:cmName.value,nozzles:[{code:cmN1.value,productId:cmP1.value},{code:cmN2.value,productId:cmP2.value}]})});toast('Machine Saved');configuration() }catch(e){toast(e.message)}}
async function auditReport(){const a=await api('/api/audit');renderModal('Audit Trail',a.slice(0,80).map(x=>`<div class="item"><div class="row"><b>${esc(x.entity_type)}</b><span>${esc(x.action)}</span></div><div class="muted">${new Date(x.created_at).toLocaleString()} · ${esc(x.reason||'No Reason')}</div></div>`).join('')||'<div class="empty">No Audit Events</div>')}
function managerMore(){return `<div class="content"><h1 class="title">More</h1><div class="quick"><button onclick="collectionsManager()">Collections & Banking<small>Cash, Digital & Bank Control</small></button><button onclick="deliveriesManager()">Deliveries<small>Received, Shortage & Recovery</small></button><button onclick="auditReport()">Audit Trail<small>Immutable Activity History</small></button><button onclick="logout()">Log Out<small>End This Session</small></button></div></div>`}
function profile(){return `<div class="content"><h1 class="title">Profile</h1><div class="card"><div class="row"><b>Name</b><span>${esc(S.user.name)}</span></div><div class="row" style="margin-top:12px"><b>Role</b><span>Salesman</span></div><div class="row" style="margin-top:12px"><b>Station</b><span>${esc(S.boot?.station?.name)}</span></div></div><button class="btn secondary" onclick="logout()">Log Out</button></div>`}
function renderModal(title,body){closeModal();const o=document.createElement('div');o.id='modal';o.className='modal';o.innerHTML=`<div class="sheet"><button class="back" onclick="closeModal()">← Back</button><h2 style="margin:0 0 14px">${esc(title)}</h2>${body}</div>`;document.body.appendChild(o);document.querySelectorAll('.denom').forEach(x=>x.addEventListener('input',updateCount));coins?.addEventListener('input',updateCount)}function closeModal(){document.getElementById('modal')?.remove()}
function logout(){localStorage.clear();S.token=null;S.user=null;render()}
async function render(){if(!S.token){await loginView();return}if(!S.boot){await boot();return}if(S.user.role==='MANAGER'){if(!S.manager)await managerOverview();let body=S.screen==='mhome'?managerHome():S.screen==='mshift'?managerShift():S.screen==='mreports'?managerReports():S.screen==='mmore'?managerMore():managerHome();root.innerHTML=header()+body+managerNav();return}if(S.user.role==='OWNER'){if(!S.owner)await ownerOverview();let body=S.screen==='orecon'?ownerReconciliation():S.screen==='oreports'?`<div class="content"><h1 class="title">Reports</h1><div class="quick"><button onclick="ownerSummary('DAY')">Today<small>Daily Business Summary</small></button><button onclick="ownerSummary('WEEK')">This Week<small>Weekly Business Summary</small></button><button onclick="ownerSummary('MONTH')">This Month<small>Monthly P&L</small></button><button onclick="ownerReports()">Detailed Reports<small>Sales, Cash, Fuel & Collections</small></button></div></div>`:S.screen==='omore'?`<div class="content"><h1 class="title">More</h1><div class="quick"><button onclick="ownerMore()">Settings & Administration<small>Users & Station Configuration</small></button><button onclick="auditReport()">Audit Trail<small>Immutable Activity History</small></button><button onclick="logout()">Log Out<small>End This Session</small></button></div></div>`:ownerHome();root.innerHTML=header()+body+ownerNav();return}if(S.user.role!=='SALESMAN'){root.innerHTML=header()+`<div class="content"><h1 class="title">${esc(S.user.role)} Dashboard</h1></div>`;return}let body=S.screen==='home'?home():S.quick?quickScreen():S.screen==='shift'?shift():S.screen==='close'?closeShift():S.screen==='profile'?profile():home();root.innerHTML=header()+body+nav();if(S.quick==='credit')loadCustomers();}
render();
</script></body></html>
