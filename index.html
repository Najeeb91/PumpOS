<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PumpOS Owner</title>
<style>
:root{--bg:#F8F7F2;--n:#1a2332;--g:#5FA83E;--s:#5a6472;--l:#e5e3da;--w:#fff}
*{box-sizing:border-box}body{margin:0;background:#e7e5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:var(--n)}
.app{max-width:390px;min-height:100vh;margin:auto;background:var(--bg);position:relative}.screen{min-height:100vh;padding-bottom:86px}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#faf9f5;z-index:5}
header b{font-size:17px}header button{border:0;background:none;font-size:22px;color:var(--n)}
main{padding:18px 16px}h1{font-size:25px;margin:0 0 5px;font-weight:800}h2{font-size:16px;margin:0}.sub{font-size:11px;color:var(--s);margin:0;line-height:1.5}
.period{display:flex;gap:6px;margin:14px 0;overflow:auto}.period button{background:#fff;border:1px solid var(--l);border-radius:10px;padding:8px 11px;font-size:10px;font-weight:700;white-space:nowrap}.period .on{background:var(--n);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.card,.tile,.row{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 2px 10px #1a23320a}.metric{padding:13px}.metric small{font-size:10px;color:var(--s)}.metric strong{display:block;font-size:17px;margin-top:5px}.green{color:var(--g)}
.card{padding:14px;margin-top:12px}.row{padding:11px 12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:11px}.row small{display:block;color:var(--s);font-size:9px;margin-top:3px}.row strong{text-align:right}
.tile{min-height:86px;padding:13px;cursor:pointer}.tile span{display:block;font-size:21px;margin-bottom:8px}.tile b{font-size:11px}.section{font-size:12px;font-weight:800;margin:18px 0 8px}.alert{padding:12px;border-radius:12px;background:#fff8ef;border:1px solid #efdcc3;font-size:11px;margin:8px 0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);height:78px;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{border:0;background:#fff;color:#69727c;font-size:8px;font-weight:750}.nav span{display:block;font-size:17px;line-height:22px}.nav .on{color:var(--g)}
.btn{width:100%;height:48px;border:0;border-radius:13px;margin-top:10px;font-weight:800}.primary{background:var(--g);color:#fff}.outline{background:#fff;border:1px solid #aeb4b2;color:var(--n)}
@media(min-width:700px){body{padding:20px 0}.app{min-height:844px;border-radius:28px;box-shadow:0 20px 60px #0002}}
</style></head><body><div class="app" id="app"></div>
<script>
let state={page:"home",period:"Today"};
const nav=[["home","⌂","Home"],["reports","▥","Reports"],["alerts","!","Alerts"],["settings","⚙","Settings"],["profile","♙","Profile"]];
function money(n){return"₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2})}
function periods(){return'<div class="period">'+["Today","This Week","This Month","Custom"].map(x=>`<button class="${state.period==x?"on":""}" onclick="state.period='${x}';render()">${x}</button>`).join("")+"</div>"}
function navBar(){return'<nav class="nav">'+nav.map(x=>`<button class="${state.page==x[0]?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")+"</nav>"}
function header(t,back=true){return`<header><button onclick="${back?'go("home")':''}">${back?"‹":""}</button><b>${t}</b><button>♙</button></header>`}
function shell(t,body,back=true){document.getElementById("app").innerHTML=`<div class="screen">${header(t,back)}<main>${body}</main></div>${navBar()}`}
function go(p){state.page=p;render()}
function home(){shell("",`
<div><h2>Hello, Owner</h2><p class="sub">Asian Filling Station · Command Center</p></div>
${periods()}<div class="grid">
${[["Total Sales",money(486250)],["Fuel Volume","4,386.70 L"],["Cash",money(212450)],["Digital",money(186300)],["Credit",money(87500)],["Expenses",money(12400)]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}</div>
<div class="card"><div style="display:flex;justify-content:space-between"><h2>Station Status</h2><b class="green" style="font-size:10px">Operational</b></div>
<div class="row"><span>Active Shifts<small>2 Salesmen · 1 Manager</small></span><strong>3</strong></div>
<div class="row"><span>Pumps<small>All Connected</small></span><strong class="green">4 / 4</strong></div>
<div class="row"><span>Pending Alerts<small>Requires Attention</small></span><strong style="color:#b87931">2</strong></div></div>
<div class="section">Quick Access</div><div class="grid">
${[["sales","▤","Sales"],["credit","♙","Credit Customers"],["digital","▣","Digital Transactions"],["operations","◫","Operations"],["pumps","♨","Pumps & Meter"],["staff","♙","Staff & Shifts"]].map(x=>`<div class="tile" onclick="go('${x[0]}')"><span>${x[1]}</span><b>${x[2]}</b></div>`).join("")}</div>`,false)}
function reports(){shell("Reports",`<h1>Reports</h1><p class="sub">Choose A Reporting Period</p>${periods()}<div class="section">Reports</div>${["Daily Sales Report","Fuel Summary","Cash Summary","Digital Reconciliation","Credit Report","Expense Report","Shift Report","Meter Report","Staff Performance"].map(x=>`<div class="row"><span>${x}<small>View Report</small></span><strong>›</strong></div>`).join("")}`)}
function alerts(){shell("Alerts",`<h1>Alerts</h1><p class="sub">Exceptions That Need Attention</p><div class="alert"><b>Meter Variance</b><br>Machine M2 · 1.75 L variance</div><div class="alert"><b>Digital Reconciliation Pending</b><br>3 transactions require review</div><div class="section">Resolved</div><div class="row"><span>Credit Limit Exception<small>Resolved · Today</small></span><strong class="green">✓</strong></div>`)}
function settings(){shell("Settings",`<h1>Settings</h1><p class="sub">Owner Control Center</p><div class="section">Organization</div>${["Station Details","Fuel & Pricing","Financial Settings"].map(x=>`<div class="row"><span>${x}</span><strong>›</strong></div>`).join("")}<div class="section">Users & Permissions</div>${["Users","Role Permissions","Approval Rules"].map(x=>`<div class="row"><span>${x}<small>View And Edit</small></span><strong>›</strong></div>`).join("")}<div class="section">Controls</div>${["Sales Controls","Credit Controls","Meter Controls","Shift Controls","Digital Controls"].map(x=>`<div class="row"><span>${x}<small>Enable · Disable · Lock</small></span><strong>›</strong></div>`).join("")}<div class="section">Security</div><div class="row"><span>Audit Log</span><strong>›</strong></div>`)}
function profile(){shell("Profile",`<h1>Owner Profile</h1><div class="card">${[["Name","Owner"],["Role","Owner"],["Station","Asian Filling Station"]].map(x=>`<div class="row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><button class="btn outline">Security</button><button class="btn outline">Login Activity</button><button class="btn primary">Log Out</button>`)}
function detail(t){shell(t,`<h1>${t}</h1><p class="sub">Owner Monitoring</p>${periods()}<div class="grid"><div class="metric"><small>Today</small><strong class="green">${money(486250)}</strong></div><div class="metric"><small>Transactions</small><strong>1,248</strong></div></div><div class="section">Recent Activity</div>${["Sale Recorded","Digital Transaction","Expense Added","Shift Started"].map(x=>`<div class="row"><span>${x}<small>View Details</small></span><strong>›</strong></div>`).join("")}<button class="btn outline" onclick="go('home')">Back to Home</button>`)}
function render(){if(state.page=="home")home();else if(state.page=="reports")reports();else if(state.page=="alerts")alerts();else if(state.page=="settings")settings();else if(state.page=="profile")profile();else detail(state.page=="pumps"?"Pumps & Meter":state.page.replace(/^\w/,c=>c.toUpperCase()))}
render();
</script></body></html>
