<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PumpOS — Mobile Onboarding Prototype</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--dark:#0f172a;--soft:#eef2f6;--green:#15803d;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#dfe4ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:var(--bg);overflow:hidden;position:relative}
.screen{min-height:100vh;padding:22px 20px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.center{justify-content:center}
.logo{font-weight:900;font-size:30px;letter-spacing:-1.7px}.mark{display:inline-block;width:10px;height:10px;background:#111827;border-radius:50%;margin-left:5px}
.brandline{display:flex;align-items:center;justify-content:space-between}.tiny{font-size:12px;color:var(--muted)}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
h1{font-size:31px;line-height:1.06;letter-spacing:-1.2px;margin:9px 0 10px}h2{font-size:24px;line-height:1.1;letter-spacing:-.7px;margin:8px 0}h3{font-size:17px;margin:0 0 5px}p{color:var(--muted);line-height:1.48;margin:0 0 18px}
.spacer{flex:1}.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;background:var(--dark);color:#fff;font-weight:850;cursor:pointer;min-height:52px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}.btn.ghost{background:transparent;color:var(--ink);padding:11px}.btn:active,.choice:active{transform:scale(.99)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{border:0;background:transparent;padding:7px 0;font-weight:800;color:var(--ink);cursor:pointer}.step{font-size:12px;color:var(--muted);font-weight:750}
.progress{height:5px;background:#e4e7ec;border-radius:99px;margin-bottom:25px;overflow:hidden}.progress i{display:block;height:100%;background:#111827;border-radius:99px;transition:.2s}
.field{margin:15px 0}.label{font-size:13px;font-weight:800;margin-bottom:7px;display:block}.input,.select{width:100%;border:1px solid #d7dce2;border-radius:13px;background:#fff;padding:14px;font-size:16px;outline:none;min-height:52px}.input:focus,.select:focus{border-color:#64748b;box-shadow:0 0 0 3px #e2e8f0}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.choice{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;text-align:left;font-weight:800;cursor:pointer;min-height:58px}.choice.active{border:2px solid #111827;padding:14px;background:#f8fafc}.choice small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:22px;margin-top:auto}.counter{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin:16px 0}.counter button{width:42px;height:42px;border:0;border-radius:11px;background:var(--soft);font-size:23px;cursor:pointer}.count{font-size:24px;font-weight:900}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric .tiny{font-weight:700}.metric b{font-size:21px;display:block;margin-top:4px}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:#16a34a;flex:none}.pending{background:#f1f5f9;color:#475569;border-radius:99px;font-size:10px;font-weight:800;padding:5px 8px}
.ready{background:#111827;color:white;border-radius:20px;padding:21px;margin-top:14px}.ready p{color:#cbd5e1}.ready .summary{margin-top:12px}.ready .metric{background:#1e293b;border-color:#334155}.ready .metric .tiny{color:#cbd5e1}.ready .metric b{color:#fff}
.splash{align-items:center;text-align:center;background:#0f172a;color:#fff}.splash .logo{color:#fff}.splash .mark{background:#fff}.loader{width:30px;height:3px;border-radius:99px;background:#334155;overflow:hidden;margin-top:24px}.loader i{display:block;height:100%;width:45%;background:#fff;animation:load 1.2s ease-in-out infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.welcome-art{margin:20px 0 28px;height:180px;border-radius:24px;background:linear-gradient(145deg,#111827,#263449);position:relative;overflow:hidden}.orb{position:absolute;border-radius:50%;background:#fff2;width:190px;height:190px;right:-60px;top:-55px}.pump-icon{position:absolute;left:28px;bottom:25px;width:82px;height:90px;border:4px solid #fff;border-radius:9px}.pump-icon:before{content:"";position:absolute;left:12px;top:13px;width:35px;height:20px;border:3px solid #fff}.pump-icon:after{content:"";position:absolute;right:-25px;top:4px;width:27px;height:53px;border:3px solid #fff;border-left:0;border-radius:0 20px 20px 0}
.dash{padding:16px}.dashhead{padding:7px 4px 18px;display:flex;justify-content:space-between;align-items:center}.dashlogo{font-weight:900;font-size:23px;letter-spacing:-1px}.avatar{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:900}.hero{background:#111827;color:#fff;border-radius:20px;padding:20px;margin-bottom:13px}.hero h2{margin:5px 0 7px}.hero p{color:#cbd5e1;margin-bottom:16px}.start{width:100%;border:0;border-radius:12px;background:#fff;color:#111827;padding:14px;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.stat b{display:block;font-size:20px;margin-top:4px}.setup-title{display:flex;justify-content:space-between;align-items:end;margin:18px 3px 7px}.setup-item{width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:14px 2px}.setup-item:last-child{border-bottom:0}.setup-list{background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 14px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#475467;font-weight:800}.success{background:#ecfdf3;color:#166534;border-radius:14px;padding:13px;font-weight:800;margin-bottom:12px}
.toast{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(390px,calc(100% - 32px));background:#111827;color:#fff;padding:13px 15px;border-radius:13px;font-size:14px;font-weight:750;box-shadow:0 12px 35px #0004;display:none}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:25px;box-shadow:0 22px 70px #0003}}
.setup-card{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;margin-top:14px;cursor:pointer}.setup-card strong{font-size:15px}.arrow{font-size:25px;color:#667085}.setup-list{background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 14px}.setup-item{width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 2px;border-bottom:1px solid var(--line)}.setup-item:last-child{border-bottom:0}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#475467;font-weight:800;white-space:nowrap}
.setup-item{cursor:pointer;min-height:62px}.setup-item small{display:block;color:#667085;font-size:12px;margin-top:3px}.formcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.formcard label{display:block;font-size:12px;font-weight:800;color:#475467;margin:10px 0 6px}.formcard input{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:12px;padding:13px;font-size:16px;outline:none;margin-bottom:4px}.later{width:100%;background:transparent;border:0;padding:14px;font-weight:700;color:#667085}

.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.choice{border:1px solid #d0d5dd;background:#fff;border-radius:11px;padding:11px 4px;font-weight:800;font-size:12px}.choice.active{border:2px solid #111827;background:#f2f4f7}.formcard select{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:12px;padding:13px;font-size:16px;background:#fff;margin-bottom:4px}.hint{font-size:12px;color:#667085;margin:7px 0 14px}

.dash-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:#667085}.sub{font-size:13px;color:#667085;margin-top:4px}.status-dot{width:10px;height:10px;border-radius:50%;background:#d0d5dd;margin-top:8px}.status-dot.on{background:#12b76a}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.metric span{display:block;color:#667085;font-size:12px}.metric strong{display:block;font-size:20px;margin-top:6px}.primary-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:14px 0}.primary-card h3{margin:6px 0}.primary-card p{font-size:13px;color:#667085}.quick-title{font-weight:800;margin:18px 0 8px}.toast{margin-top:12px;padding:11px 13px;border-radius:12px;background:#f2f4f7;font-size:12px}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast" class="toast"></div>
<script>
const S={screen:"splash",step:0,lang:"English",role:"Owner",oil:"IndianOil",products:["Petrol","Diesel"],machines:2,name:"",station:"",mobile:"",pin:"",otp:"",started:false,module:"",employees:0,tankCount:0,shiftStart:"06:00",shiftEnd:"22:00",creditCustomers:0,openingBalance:0,expense:0}
try{
 const saved=JSON.parse(localStorage.getItem("pumpos_state")||"null");
 if(saved&&typeof saved==="object") S={...S,...saved};
}catch(e){}
function persist(){try{localStorage.setItem("pumpos_state",JSON.stringify(S))}catch(e){}}

/* PumpOS operational engine v6 */
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function money(v){return "₹"+num(v).toLocaleString("en-IN",{maximumFractionDigits:2})}
function litres(v){return num(v).toLocaleString("en-IN",{maximumFractionDigits:2})+" L"}
function ensureData(){
 S.station=S.station||{name:"Asian Filling Station",products:["Petrol","Diesel"],machines:2,nozzles:4,tanks:2};
 S.operations=S.operations||{shiftOpen:false,shiftName:"",startedAt:null,sales:0,fuelLitres:0,cash:0,credit:0};
 S.lastAction=S.lastAction||"";
}
ensureData();
function demoSale(){ensureData();S.operations.sales+=5000;S.operations.fuelLitres+=40;S.operations.cash+=5000;S.lastAction="Demo sale recorded.";persist();render()}
function startOperationalShift(){
 ensureData();
 if(S.operations.shiftOpen)return;
 S.operations.shiftOpen=true;
 S.operations.shiftName="Shift A";
 S.operations.startedAt=new Date().toISOString();
 S.lastAction="First shift started successfully.";
 persist(); render();
}
function closeOperationalShift(){
 ensureData();
 S.operations.shiftOpen=false;
 S.lastAction="Shift closed.";
 persist(); render();
}
;
const app=document.getElementById("app"),toast=document.getElementById("toast");
function showToast(t){toast.textContent=t;toast.style.display="block";clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display="none",2200)}
function go(screen,step=0){S.screen=screen;persist();S.step=step;render()}
function next(){go("form",S.step+1)}
function back(){if(S.step>1)go("form",S.step-1);else go("welcome")}
function field(label,key,type="text",placeholder=""){return `<div class="field"><label class="label">${label}</label><input class="input" type="${type}" placeholder="${placeholder}" value="${S[key]||""}" oninput="S.${key}=this.value"></div>`}
function choices(items,key){return `<div class="choicegrid">${items.map(x=>`<button class="choice ${S[key]===x?"active":""}" onclick="S.${key}='${x}';render()">${x}</button>`).join("")}</div>`}
function productChoices(){return `<div class="choicegrid">${["Petrol","Diesel","CNG","Lubricants","Other"].map(x=>`<button class="choice ${S.products.includes(x)?"active":""}" onclick="toggleProduct('${x}')">${x}<small>${S.products.includes(x)?"Selected":"Tap to select"}</small></button>`).join("")}</div>`}
function toggleProduct(x){if(S.products.includes(x)){if(S.products.length>1)S.products=S.products.filter(p=>p!==x)}else S.products.push(x);render()}
function machineCounter(){return `<div class="counter"><button onclick="S.machines=Math.max(1,S.machines-1);render()">−</button><div><div class="tiny">Dispensing machines</div><div class="count">${S.machines}</div></div><button onclick="S.machines=Math.min(12,S.machines+1);render()">+</button></div>`}
function stepShell(title,sub,body){let pct=Math.round((S.step/8)*100);return `<div class="screen"><div class="top"><button class="back" onclick="back()">‹ Back</button><div class="step">Step ${S.step} of 8</div></div><div class="progress"><i style="width:${pct}%"></i></div><div><div class="kicker">PumpOS setup</div><h2>${title}</h2><p>${sub}</p>${body}</div><div class="spacer"></div><div class="sticky"><button class="btn" onclick="handleStep()">Continue</button></div></div>`}
function handleStep(){
 if(S.step===1){if(!S.lang)return;next()}
 else if(S.step===2){if(!/^[0-9]{10}$/.test(S.mobile)){showToast("Enter a valid 10-digit mobile number");return}showToast("Demo OTP sent: 123456");next()}
 else if(S.step===3){if(S.otp!=="123456"){showToast("Use demo OTP 123456");return}next()}
 else if(S.step===4){if(!S.name){showToast("Please enter your name");return}next()}
 else if(S.step===5){if(!S.station||!S.pin){showToast("Add station name and PIN code");return}next()}
 else if(S.step===6){if(!S.products.length){showToast("Select at least one product");return}next()}
 else if(S.step===7){next()}
 else if(S.step===8){go("ready")}
}
function render(){
 if(S.screen==="splash"){app.innerHTML=`<div class="screen splash center"><div><div class="logo">PumpOS<span class="mark"></span></div><div class="loader"><i></i></div></div></div>`;setTimeout(()=>go("welcome"),1400);return}
 if(S.screen==="welcome"){app.innerHTML=`<div class="screen center"><div class="brandline"><div class="logo">PumpOS<span class="mark"></span></div><div class="tiny">Fuel station OS</div></div><div class="welcome-art"><div class="orb"></div><div class="pump-icon"></div></div><div class="kicker">One place for your station</div><h1>Run your entire fuel station from one place.</h1><p>Sales • Stock • Shifts • Staff • Accounts</p><div class="spacer"></div><button class="btn" onclick="go('form',1)">Get Started</button><button class="btn secondary" onclick="showToast('Login flow is available for existing users')">Already have an account? Log in</button></div>`;return}
 if(S.screen==="form"){
  let b="";
  if(S.step===1)b=choices(["English","हिन्दी","Other Indian languages"],"lang");
  if(S.step===2)b=field("Mobile Number","mobile","tel","10-digit mobile number")+`<div class="tiny">For prototype testing, any valid 10-digit number is accepted.</div>`;
  if(S.step===3)b=field("6-digit OTP","otp","tel","123456")+`<div class="tiny">Demo OTP: <b>123456</b></div>`;
  if(S.step===4)b=field("Full Name","name","text","Your name")+`<div class="label">Your Role</div>`+choices(["Owner","Manager","Accountant","Other"],"role");
  if(S.step===5)b=field("Petrol Pump / Station Name","station","text","e.g. Asian Filling Station")+`<div class="label">Oil Company</div>`+choices(["IndianOil","BPCL","HPCL","Other"],"oil")+field("PIN Code","pin","tel","6-digit PIN code")+`<div class="tiny">Address, GSTIN and dealer/RO code can be completed later.</div>`;
  if(S.step===6)b=`<div class="label">Select what your station sells</div>${productChoices()}`;
  if(S.step===7)b=machineCounter()+`<div class="card"><b>Keep it simple</b><div class="tiny" style="margin-top:5px">You can configure nozzles and advanced machine details later.</div></div>`;
  if(S.step===8)b=`<div class="card"><div class="check"><span class="dot"></span><b>Station profile</b></div><div class="check"><span class="dot"></span><b>Products</b></div><div class="check"><span class="dot"></span><b>Basic machines</b></div><div class="check"><span class="dot"></span><b>Ready for progressive setup</b></div></div>`;
  app.innerHTML=stepShell(["Choose your language","Create your PumpOS account","Verify your mobile","Tell us about you","Tell us about your station","What do you sell?","How many dispensing machines?","Your basic setup is ready"][S.step-1],
  ["English is selected by default. You can change language later.","Your mobile number will be the primary identity for this account.","Enter the verification code to continue.","Set up the primary station administrator.","We only need the minimum information to create your station workspace.","Start with the products you actually sell.","Choose the number of machines. Advanced nozzle setup can wait.","PumpOS will take you to the station-ready screen."][S.step-1],b);return}
 if(S.screen==="ready"){app.innerHTML=`<div class="screen"><div class="top"><div class="logo" style="font-size:23px">PumpOS<span class="mark"></span></div><div class="tiny">Initial setup</div></div><div class="kicker">Station ready</div><h1>Your station is ready for PumpOS.</h1><p>We kept the first setup intentionally lightweight. You can configure the deeper operational modules from inside the app.</p><div class="ready"><div class="tiny">Station</div><h2>${S.station||"Your Fuel Station"}</h2><div class="summary"><div class="metric"><div class="tiny">Machines</div><b>${S.machines}</b></div><div class="metric"><div class="tiny">Products</div><b>${S.products.length}</b></div></div></div><div class="card"><div class="check"><span class="dot"></span>Basic station workspace created</div><div class="check"><span class="dot"></span>Products configured</div><div class="check"><span class="dot"></span>Machines configured</div><div class="check"><span class="dot"></span>Advanced setup can continue later</div></div><div class="spacer"></div><button class="btn" onclick="go('dashboard')">Enter PumpOS</button></div>`;return}
 if(S.screen==="dashboard"){ensureData();const o=S.operations;app.innerHTML=`<div class="screen">
<div class="dash-head"><div><div class="eyebrow">TODAY'S OPERATIONS</div><h2>${S.station?.name||"Asian Filling Station"}</h2><div class="sub">${o.shiftOpen?"Shift A is open":"Station hasn’t started today’s operations yet."}</div></div><div class="status-dot ${o.shiftOpen?"on":""}"></div></div>
<div class="metric-grid"><div class="metric"><span>Sales</span><strong>${money(o.sales)}</strong></div><div class="metric"><span>Fuel Sold</span><strong>${litres(o.fuelLitres)}</strong></div><div class="metric"><span>Cash</span><strong>${money(o.cash)}</strong></div><div class="metric"><span>Credit</span><strong>${money(o.credit)}</strong></div></div>
<div class="primary-card"><div class="eyebrow">PRIMARY ACTION</div><h3>${o.shiftOpen?"Shift in progress":"Start your first shift"}</h3><p>${o.shiftOpen?"Your station is ready for today's sales operations.":"Begin today's operations by opening a shift."}</p>${o.shiftOpen?`<button class="btn" onclick="go('operations')">OPEN SHIFT OPERATIONS</button>`:`<button class="btn" onclick="startOperationalShift()">START SHIFT</button>`}</div>
<div class="quick-title">Station setup</div><div class="setup-item" onclick="go('setup')"><span><strong>Complete your setup</strong><small>Manage tanks, shifts, staff, credit and accounts</small></span><span class="arrow">›</span></div>
${o.lastAction?`<div class="toast">${o.lastAction}</div>`:""}
</div>`;return}
if(S.screen==="operations"){ensureData();const o=S.operations;app.innerHTML=`<div class="screen"><div class="top"><button class="back" onclick="go('dashboard')">‹ Dashboard</button><div class="step">Live Operations</div></div><div class="kicker">Shift A</div><h2>Today's operations</h2><div class="metric-grid"><div class="metric"><span>Sales</span><strong>${money(o.sales)}</strong></div><div class="metric"><span>Fuel Sold</span><strong>${litres(o.fuelLitres)}</strong></div></div><div class="primary-card"><h3>Record sales</h3><p>Operational entry screens will connect here to nozzle/meter data.</p><button class="btn" onclick="demoSale()">ADD DEMO SALE</button></div><button class="later" onclick="closeOperationalShift()">Close shift</button></div>`;return}
 if(S.screen==="setup"){app.innerHTML=`<div class="screen"><div class="top"><button class="back" onclick="go('dashboard')">‹ Dashboard</button><div class="step">Station Setup</div></div><div class="kicker">Progressive setup</div><h2>Complete your setup</h2><p>Configure what you need now. Everything else can be completed later.</p><div class="setup-list">
<div class="setup-item" onclick="openSetup('employees')"><span><strong>Add employees</strong><small>Add team members and roles</small></span><span class="arrow">›</span></div>
<div class="setup-item" onclick="openSetup('tanks')"><span><strong>Configure tanks & DIP</strong><small>Set tanks and opening readings</small></span><span class="arrow">›</span></div>
<div class="setup-item" onclick="openSetup('shifts')"><span><strong>Set shift timings</strong><small>Configure operating shifts</small></span><span class="arrow">›</span></div>
<div class="setup-item" onclick="openSetup('credit')"><span><strong>Credit customers</strong><small>Set up fuel credit if applicable</small></span><span class="arrow">›</span></div>
<div class="setup-item" onclick="openSetup('accounts')"><span><strong>Opening balances</strong><small>Start with financial opening position</small></span><span class="arrow">›</span></div>
<div class="setup-item" onclick="openSetup('expenses')"><span><strong>Expenses</strong><small>Configure common station expenses</small></span><span class="arrow">›</span></div>
</div><div class="spacer"></div><button class="btn" onclick="go('dashboard')">Back to Dashboard</button></div>`;return}
 if(S.screen==="setupDetail"){renderSetupDetail();return}
}
function openModule(module){S.module=module;S.screen="module";render()}
function saveModule(){
 if(S.module==="employees"){if(S.employees<1){showToast("Add at least 1 employee");return}showToast("Employees saved")}
 else if(S.module==="tanks"){if(S.tankCount<1){showToast("Add at least 1 tank");return}showToast("Tank setup saved")}
 else if(S.module==="shifts"){if(!S.shiftStart||!S.shiftEnd){showToast("Set shift timings");return}showToast("Shift timings saved")}
 else if(S.module==="credit"){showToast("Credit customer setup saved")}
 else if(S.module==="accounts"){showToast("Opening balance saved")}
 else if(S.module==="expenses"){showToast("Expense setup saved")}
 go("setup")
}
function openSetup(type){S.setupType=type;S.screen="setupDetail";render()}
function renderSetupDetail(){
 const type=S.setupType;
 let body="";
 if(type==="tanks"){
  body=`<label>Tank ID</label><input id="tankId" placeholder="e.g. T1"><label>Product</label><select id="tankProduct"><option>Petrol</option><option>Diesel</option><option>CNG</option></select><label>Capacity (L)</label><input id="tankCapacity" type="number" placeholder="e.g. 20000"><label>Opening / DIP stock (optional)</label><input id="tankStock" type="number" placeholder="Enter litres">`;
 }else if(type==="shifts"){
  body=`<label>Shift duration</label><div class="choice-row"><button type="button" class="choice active" onclick="pickDuration(this,8)">8 hours</button><button type="button" class="choice" onclick="pickDuration(this,12)">12 hours</button><button type="button" class="choice" onclick="pickDuration(this,24)">24 hours</button></div><input type="hidden" id="shiftDuration" value="8"><label>Start time</label><input id="shiftStart" type="time" value="06:00" onchange="calcShiftEnd()"><label>End time</label><input id="shiftEnd" type="time" value="14:00" readonly><div class="hint">PumpOS calculates the end time automatically.</div>`;
 }else if(type==="accounts"){
  body=`<label>Account</label><select id="accountType"><option>Cash</option><option>Bank</option><option>UPI</option><option>Card Settlement</option><option>Customer Credit / Receivables</option><option>Supplier Payable</option></select><label>Opening balance</label><input id="accountAmount" type="number" placeholder="₹ 0"><div class="hint">This establishes the financial starting position for this account.</div>`;
 }else{
  const labels={employees:["Employee name","Role"],credit:["Customer name","Credit limit"],expenses:["Expense name","Monthly amount"]}[type]||["Name","Details"];
  body=`<label>${labels[0]}</label><input id="setupA" placeholder="${labels[0]}"><label>${labels[1]}</label><input id="setupB" placeholder="${labels[1]}">`;
 }
 const titles={employees:"Add employees",tanks:"Configure tanks & DIP",shifts:"Set shift timings",credit:"Credit customers",accounts:"Opening balances",expenses:"Expenses"};
 const subtitles={employees:"Add your station team and roles.",tanks:"Define each underground tank and its opening position.",shifts:"Choose a shift duration and start time.",credit:"Set up fuel credit if your station offers it.",accounts:"Establish your starting financial position.",expenses:"Configure common station expenses."};
 app.innerHTML=`<div class="screen"><div class="top"><button class="back" onclick="go('setup')">‹ Setup</button><div class="step">Setup module</div></div><div class="kicker">Station configuration</div><h2>${titles[type]}</h2><p>${subtitles[type]}</p><div class="formcard">${body}<button class="btn" onclick="saveSetup()">Save & Continue</button><button class="later" onclick="go('setup')">Do this later</button></div></div>`;
 if(type==="shifts") calcShiftEnd();
}
function pickDuration(btn,hours){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById("shiftDuration").value=hours;calcShiftEnd()}
function calcShiftEnd(){const s=document.getElementById("shiftStart"),e=document.getElementById("shiftEnd"),d=document.getElementById("shiftDuration");if(!s||!e||!d)return;let [h,m]=s.value.split(":").map(Number);let total=(h*60+m)+Number(d.value)*60;total%=1440;e.value=String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0")}

function saveSetup(){S.setupSaved=true;persist();go('setup')}

function startShift(){startOperationalShift()}

function restoreLastSession(){
 try{
  const saved=JSON.parse(localStorage.getItem("pumpos_state")||"null");
  if(saved && saved.hasOnboarded){
   S.screen=saved.screen||"dashboard";
   if(["splash","welcome","register","login","otp"].includes(S.screen)) S.screen="dashboard";
  }
 }catch(e){}
}
restoreLastSession();
render();
</script>
</body>
</html>
