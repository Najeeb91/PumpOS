<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>PumpOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(390px,100vw);height:100vh;min-height:100vh;margin:auto;background:#f8fafc;overflow:hidden;position:relative}.screen{height:100%;overflow-y:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{border:0;background:transparent;font-weight:800;padding:6px 0}.eyebrow,.kicker{font-size:11px;letter-spacing:.08em;font-weight:800;color:#667085}.kicker{margin-top:10px}h1,h2,h3,p{margin-top:0}h2{font-size:25px;margin:6px 0}p{color:#667085;font-size:13px;line-height:1.45}.btn{width:100%;border:0;border-radius:13px;background:#111827;color:#fff;padding:14px;font-weight:800;margin-top:10px}.later{width:100%;border:0;background:transparent;padding:13px;font-weight:700;color:#667085}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.card,.primary-card,.item{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px}.metric span{font-size:11px;color:#667085}.metric strong{display:block;font-size:20px;margin-top:5px}.primary-card{margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px;text-align:left}.tile b{display:block}.tile small{display:block;color:#667085;font-size:11px;margin-top:5px;line-height:1.35}.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.item small{display:block;color:#667085;font-size:11px;margin-top:4px}.form{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:14px}.form label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}.form input,.form select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;background:#fff}.nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ec;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;font-size:10px;font-weight:800;color:#667085}.nav button.active{color:#111827}.pill{display:inline-block;background:#eef2f6;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.ok{color:#067647}.warn{color:#b54708}.danger{color:#b42318}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 28px));background:#111827;color:#fff;padding:11px 13px;border-radius:12px;font-size:12px;z-index:10}.hidden{display:none}
.item input[type=checkbox]{width:20px;height:20px;flex:0 0 auto}</style></head><body><div class="app" id="app"></div><script>
const KEY="pumpos_v10";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{
 screen:"welcome",role:"Owner",station:{name:"Asian Filling Station",oil:"IndianOil",city:"Bhiwadi",state:"Rajasthan",pin:"",gstin:""},
 products:[{id:"P1",name:"Petrol",price:0,opening:0},{id:"P2",name:"Diesel",price:0,opening:0}],
 tanks:[{id:"T1",product:"Petrol",capacity:20000,dip:0},{id:"T2",product:"Diesel",capacity:20000,dip:0}],
 nozzles:[{id:"M1-N1",product:"Petrol",meter:0},{id:"M1-N2",product:"Petrol",meter:0},{id:"M2-N1",product:"Diesel",meter:0},{id:"M2-N2",product:"Diesel",meter:0}],
 shifts:[],activeShift:null,employees:[],customers:[],receipts:[],expenses:[],accounts:{cash:0,bank:0},sales:[],audit:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const liters=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})+" L";
function audit(action,detail=""){S.audit.unshift({at:new Date().toISOString(),role:S.role,action,detail});S.audit=S.audit.slice(0,300);save()}
function canAccess(screen){
 const r=S.role||"Owner";
 if(r==="Owner") return true;
 const manager=["dashboard","sales","shift","stock","receipts","reconcile","checklist","alerts","maintenance","customers","reports","more","audit"];
 if(r==="Manager") return manager.includes(screen);
 return ["dashboard","sales","shift","reconcile"].includes(screen);
}
function go(screen){if(!canAccess(screen)){toast("Access restricted for "+(S.role||"Owner"));return}S.screen=screen;save();render()}
function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function nav(){return `<div class="nav"><button class="${S.screen==='dashboard'?'active':''}" onclick="go('dashboard')">⌂<br>Home</button><button class="${S.screen==='sales'?'active':''}" onclick="go('sales')">⛽<br>Sales</button><button class="${S.screen==='stock'?'active':''}" onclick="go('stock')">▣<br>Stock</button><button class="${S.screen==='more'?'active':''}" onclick="go('more')">☰<br>More</button></div>`}
function header(title){return `<div class="top"><button class="back" onclick="go('dashboard')">‹ Back</button><span class="pill">${S.role}</span></div><div class="kicker">PUMP0S</div><h2>${title}</h2>`}
function dashboard(){
 const sales=S.sales.filter(x=>x.date===new Date().toISOString().slice(0,10));let total=sales.reduce((a,x)=>a+x.amount,0),vol=sales.reduce((a,x)=>a+x.litres,0);
 const active=S.activeShift;
 let tiles=`<div class="grid">
 <button class="tile" onclick="go('sales')"><b>⛽ Fuel Sales</b><small>Nozzle, meter, price & payment</small></button>
 <button class="tile" onclick="go('shift')"><b>◷ Shift</b><small>Open, monitor & close</small></button>
 <button class="tile" onclick="go('stock')"><b>▣ Stock & DIP</b><small>Tanks, receipts & reconciliation</small></button>
 <button class="tile" onclick="go('reconcile')"><b>✓ Reconcile</b><small>Meter, stock & payments</small></button>
 <button class="tile" onclick="go('checklist')"><b>✓ Checklist</b><small>Daily station checks</small></button>
 <button class="tile" onclick="go('alerts')"><b>⚠ Alerts</b><small>Exceptions & controls</small></button>
 </div>`;
 if(S.role==="Owner"||S.role==="Manager")tiles+=`<div class="grid" style="margin-top:9px">${S.role==="Owner"?`<button class="tile" onclick="go('setup')"><b>⚙ Station Setup</b><small>Products, tanks, machines</small></button><button class="tile" onclick="go('staff')"><b>👥 Staff</b><small>Owner, Manager, Salesman</small></button><button class="tile" onclick="go('accounts')"><b>₹ Accounts</b><small>Cash, bank, receivables</small></button>`:""}<button class="tile" onclick="go('reports')"><b>▤ Reports</b><small>Operations & finance</small></button>
 <button class="tile" onclick="go('customers')"><b>▤ Credit</b><small>Customers & outstanding</small></button>
 <button class="tile" onclick="go('cashbook')"><b>₹ Cashbook</b><small>Cash movements</small></button>
 <button class="tile" onclick="go('priceHistory')"><b>↕ Prices</b><small>Price changes & history</small></button>
 <button class="tile" onclick="go('maintenance')"><b>🔧 Maintenance</b><small>Equipment issues</small></button>
 <button class="tile" onclick="go('documents')"><b>▤ Documents</b><small>Station records</small></button>
 <button class="tile" onclick="go('security')"><b>⚙ Security</b><small>Access & backup</small></button></div>`;
 return `<div class="screen"><div class="top"><div><div class="eyebrow">${S.role.toUpperCase()} DASHBOARD</div><h2>${S.station.name}</h2></div><span class="pill">${active?"SHIFT OPEN":"NO ACTIVE SHIFT"}</span></div>
 <div class="metric-grid"><div class="metric"><span>Today's Sales</span><strong>${money(total)}</strong></div><div class="metric"><span>Fuel Sold</span><strong>${liters(vol)}</strong></div><div class="metric"><span>Cash</span><strong>${money(sales.filter(x=>x.payment==="Cash").reduce((a,x)=>a+x.amount,0))}</strong></div><div class="metric"><span>Credit</span><strong>${money(sales.filter(x=>x.payment==="Credit").reduce((a,x)=>a+x.amount,0))}</strong></div></div>
 <div class="primary-card"><div class="eyebrow">TODAY'S NEXT ACTION</div><h3>${active?"Continue station operations":"Start today's shift"}</h3><p>${active?"Record fuel sales and reconcile before closing.":"A shift is required before operational sales can be entered."}</p><button class="btn" onclick="go('${active?'sales':'shift'}')">${active?"RECORD FUEL SALE":"START SHIFT"}</button></div>${tiles}</div>${nav()}`}

function sales(){
 if(!S.activeShift)return `<div class="screen">${header("Fuel Sale")}<div class="primary-card"><h3>No active shift</h3><p>Sales cannot be recorded until a shift is opened.</p><button class="btn" onclick="go('shift')">START SHIFT</button></div></div>${nav()}`;
 let n=S.nozzles[0], opts=S.nozzles.map(x=>`<option value="${x.id}">${x.id} • ${x.product}</option>`).join("");
 return `<div class="screen">${header("Record Fuel Sale")}<p>Use the nozzle totalizer. PumpOS calculates litres and amount.</p><div class="form"><label>Nozzle</label><select id="sn" onchange="syncMeter()">${opts}</select><label>Opening totalizer</label><input id="so" type="number" step=".01" value="${n.meter}"><label>Closing totalizer</label><input id="sc" type="number" step=".01" placeholder="Enter reading"><label>Selling price / L</label><input id="sr" type="number" step=".01" value="${(S.products.find(p=>p.name===n.product)||{}).price||""}" placeholder="Set product price"><label>Payment</label><select id="sp"><option>Cash</option><option>UPI</option><option>Card</option><option>Fleet Card</option><option>Credit</option></select><button class="btn" onclick="recordSale()">RECORD SALE</button></div></div>${nav()}`}

function recordSale(){
 const id=sn.value,n=S.nozzles.find(x=>x.id===id),o=+so.value,c=+sc.value,r=+sr.value;
 if(c<=o||r<=0)return toast("Check meter readings and price");
 const q=c-o,a=q*r,p=sp.value;
 S.sales.push({id:"TX"+Date.now(),date:new Date().toISOString().slice(0,10),shift:S.activeShift.id,nozzle:id,product:n.product,opening:o,closing:c,litres:q,rate:r,amount:a,payment:p,at:new Date().toISOString()});
 n.meter=c;audit("SALE",`${id} ${q.toFixed(2)}L ${money(a)} ${p}`);save();toast("Sale recorded");go("dashboard")
}
function syncMeter(){const n=S.nozzles.find(x=>x.id===sn.value);so.value=n.meter}

function shift(){
 if(S.activeShift)return `<div class="screen">${header("Shift Control")}<div class="primary-card"><span class="pill">OPEN</span><h3>${S.activeShift.name}</h3><p>Started ${new Date(S.activeShift.start).toLocaleString()}</p><button class="btn" onclick="go('sales')">GO TO SALES</button><button class="later" onclick="closeShift()">CLOSE & RECONCILE SHIFT</button></div></div>${nav()}`;
 return `<div class="screen">${header("Open Shift")}<p>Select the station shift before starting operations.</p><div class="form"><label>Shift name</label><select id="shn"><option>Shift A</option><option>Shift B</option><option>Shift C</option><option>Custom</option></select><label>Duration</label><select id="shd"><option value="8">8 hours</option><option value="12">12 hours</option><option value="24">24 hours</option></select><label>Start time</label><input id="sht" type="time" value="06:00"><button class="btn" onclick="openShift()">START SHIFT</button></div></div>${nav()}`}
function openShift(){S.activeShift={id:"SH"+Date.now(),name:shn.value,duration:+shd.value,start:new Date().toISOString(),openingMeters:Object.fromEntries(S.nozzles.map(n=>[n.id,n.meter]))};S.shifts.unshift(S.activeShift);audit("SHIFT_OPEN",S.activeShift.name);save();go("dashboard")}
function closeShift(){const sales=S.sales.filter(x=>x.shift===S.activeShift.id),amount=sales.reduce((a,x)=>a+x.amount,0),vol=sales.reduce((a,x)=>a+x.litres,0);S.activeShift.close=new Date().toISOString();S.activeShift.sales=amount;S.activeShift.litres=vol;audit("SHIFT_CLOSE",`${sales.length} transactions ${money(amount)}`);S.activeShift=null;save();toast("Shift closed");go("reconcile")}

function stock(){
 return `<div class="screen">${header("Stock & Tanks")}<p>Tank stock is based on opening/DIP, receipts and recorded sales. Physical readings remain the control baseline.</p>${S.tanks.map(t=>`<div class="item"><div><b>${t.id} • ${t.product}</b><small>Capacity ${t.capacity.toLocaleString()} L • DIP ${t.dip.toLocaleString()} L</small></div><span class="pill">${t.dip?liters(t.dip):"NOT SET"}</span></div>`).join("")}<button class="btn" onclick="go('receipts')">FUEL RECEIPTS</button><button class="later" onclick="go('setup')">EDIT TANKS</button></div>${nav()}`}
function receipts(){return `<div class="screen">${header("Fuel Receipts")}<p>Record incoming fuel before it becomes part of available stock.</p><div class="form"><label>Tank</label><select id="rt">${S.tanks.map(t=>`<option>${t.id}</option>`).join("")}</select><label>Product</label><input id="rp" placeholder="Petrol / Diesel"><label>Quantity (L)</label><input id="rq" type="number"><label>Supplier / invoice</label><input id="ri" placeholder="Invoice number"><button class="btn" onclick="addReceipt()">SAVE RECEIPT</button></div>${S.receipts.slice(0,10).map(r=>`<div class="item"><div><b>${r.tank} • ${r.product}</b><small>${r.invoice}</small></div><span>${liters(r.qty)}</span></div>`).join("")}</div>${nav()}`}
function addReceipt(){const q=+rq.value;if(q<=0)return toast("Enter quantity");S.receipts.unshift({tank:rt.value,product:rp.value,qty:q,invoice:ri.value,at:new Date().toISOString()});audit("FUEL_RECEIPT",`${q}L ${ri.value}`);save();toast("Receipt saved");go("receipts")}

function reconcile(){let sales=S.sales.filter(x=>!S.activeShift||x.shift===S.activeShift.id),vol=sales.reduce((a,x)=>a+x.litres,0),amt=sales.reduce((a,x)=>a+x.amount,0);return `<div class="screen">${header("Reconciliation")}<div class="metric-grid"><div class="metric"><span>Transactions</span><strong>${sales.length}</strong></div><div class="metric"><span>Fuel</span><strong>${liters(vol)}</strong></div><div class="metric"><span>Sales</span><strong>${money(amt)}</strong></div><div class="metric"><span>Exceptions</span><strong>0</strong></div></div><div class="primary-card"><h3>Control checks</h3><p class="ok">✓ Meter movements recorded</p><p class="ok">✓ Payment method captured</p><p class="ok">✓ Transaction IDs created</p><p class="warn">! Physical cash/stock verification remains an operator responsibility.</p></div></div>${nav()}`}

function setup(){return `<div class="screen">${header("Station Setup")}<p>Owner configuration. Changes here affect station operations.</p><div class="item"><div><b>Station</b><small>${S.station.name} • ${S.station.oil}</small></div><span class="pill">READY</span></div><div class="item"><div><b>Products</b><small>${S.products.map(x=>x.name).join(" • ")}</small></div></div><div class="item"><div><b>Tanks</b><small>${S.tanks.length} tanks</small></div></div><div class="item"><div><b>Machines / Nozzles</b><small>${S.nozzles.length} nozzles</small></div></div><button class="btn" onclick="go('stationEdit')">STATION PROFILE</button><button class="btn" onclick="go('productEdit')">PRODUCTS & PRICES</button><button class="btn" onclick="go('tankEdit')">TANKS & DIP</button><button class="btn" onclick="go('nozzleEdit')">MACHINES & NOZZLES</button></div>${nav()}`}
function stationEdit(){return `<div class="screen">${header("Station Profile")}<div class="form"><label>Station name</label><input id="stn" value="${S.station.name}"><label>Oil company</label><select id="sto"><option>IndianOil</option><option>BPCL</option><option>HPCL</option><option>Other</option></select><label>City</label><input id="stc" value="${S.station.city}"><label>State</label><input id="sts" value="${S.station.state}"><label>PIN code</label><input id="stp" value="${S.station.pin}"><label>GSTIN (optional)</label><input id="gst" value="${S.station.gstin}"><button class="btn" onclick="saveStation()">SAVE</button></div></div>${nav()}`}
function saveStation(){Object.assign(S.station,{name:stn.value,oil:sto.value,city:stc.value,state:sts.value,pin:stp.value,gstin:gst.value});audit("STATION_UPDATE");save();go("setup")}
function productEdit(){return `<div class="screen">${header("Products & Prices")}${S.products.map((p,i)=>`<div class="form" style="margin:8px 0"><b>${p.name}</b><label>Selling price / L</label><input id="pp${i}" type="number" value="${p.price}"><label>Opening stock (L)</label><input id="po${i}" type="number" value="${p.opening}"></div>`).join("")}<button class="btn" onclick="saveProducts()">SAVE PRODUCTS</button></div>${nav()}`}
function saveProducts(){S.products.forEach((p,i)=>{p.price=+document.getElementById("pp"+i).value;p.opening=+document.getElementById("po"+i).value});audit("PRODUCT_UPDATE");save();go("setup")}
function tankEdit(){return `<div class="screen">${header("Tanks & DIP")}${S.tanks.map((t,i)=>`<div class="form" style="margin:8px 0"><b>${t.id} • ${t.product}</b><label>Capacity</label><input id="tc${i}" type="number" value="${t.capacity}"><label>Opening / current DIP</label><input id="td${i}" type="number" value="${t.dip}"></div>`).join("")}<button class="btn" onclick="saveTanks()">SAVE TANKS</button></div>${nav()}`}
function saveTanks(){S.tanks.forEach((t,i)=>{t.capacity=+document.getElementById("tc"+i).value;t.dip=+document.getElementById("td"+i).value});audit("TANK_UPDATE");save();go("setup")}
function nozzleEdit(){return `<div class="screen">${header("Machines & Nozzles")}<p>Identifiers stay human-readable for station operators.</p>${S.nozzles.map((n,i)=>`<div class="item"><div><b>${n.id}</b><small>${n.product}</small></div><span>${liters(n.meter)}</span></div>`).join("")}</div>${nav()}`}

function staff(){return `<div class="screen">${header("Staff & Roles")}<div class="item"><div><b>Owner</b><small>Full station, financial and configuration control</small></div></div><div class="item"><div><b>Manager</b><small>Daily operations, stock, shifts, reconciliation and reports</small></div></div><div class="item"><div><b>Salesman</b><small>Fuel sales, nozzle readings and payment collection</small></div></div><button class="btn" onclick="go('role')">SWITCH DEMO ROLE</button></div>${nav()}`}
function role(){return `<div class="screen">${header("Role Access")}<p>Demo mode. Production will use secure user accounts and permissions.</p><div class="form"><label>Current role</label><select id="rr"><option>Owner</option><option>Manager</option><option>Salesman</option></select><button class="btn" onclick="S.role=rr.value;audit('ROLE_SWITCH',S.role);go('dashboard')">APPLY ROLE</button></div></div>${nav()}`}
function accounts(){return `<div class="screen">${header("Accounts")}<div class="metric-grid"><div class="metric"><span>Cash</span><strong>${money(S.accounts.cash)}</strong></div><div class="metric"><span>Bank</span><strong>${money(S.accounts.bank)}</strong></div></div><div class="primary-card"><h3>Financial integrity</h3><p>Sales, expenses, receipts and opening balances should feed the ledger rather than being manually overwritten.</p></div><button class="btn" onclick="go('expenses')">EXPENSES</button></div>${nav()}`}
function expenses(){return `<div class="screen">${header("Expenses")}<div class="form"><label>Category</label><select id="ec"><option>Electricity</option><option>Salaries</option><option>Maintenance</option><option>Bank charges</option><option>Station expense</option><option>Miscellaneous</option></select><label>Amount</label><input id="ea" type="number"><label>Note</label><input id="en" placeholder="Description"><button class="btn" onclick="addExpense()">SAVE EXPENSE</button></div>${S.expenses.slice(0,10).map(e=>`<div class="item"><div><b>${e.category}</b><small>${e.note}</small></div><span>${money(e.amount)}</span></div>`).join("")}</div>${nav()}`}
function addExpense(){const a=+ea.value;if(a<=0)return toast("Enter amount");S.expenses.unshift({category:ec.value,amount:a,note:en.value,at:new Date().toISOString()});audit("EXPENSE",money(a));save();go("expenses")}
function reports(){const total=S.sales.reduce((a,x)=>a+x.amount,0),vol=S.sales.reduce((a,x)=>a+x.litres,0);return `<div class="screen">${header("Reports")}<div class="metric-grid"><div class="metric"><span>Sales</span><strong>${money(total)}</strong></div><div class="metric"><span>Fuel</span><strong>${liters(vol)}</strong></div><div class="metric"><span>Transactions</span><strong>${S.sales.length}</strong></div><div class="metric"><span>Expenses</span><strong>${money(S.expenses.reduce((a,x)=>a+x.amount,0))}</strong></div></div><div class="primary-card"><h3>Reports available</h3><p>Daily sales • product-wise sales • nozzle-wise sales • shift summary • payment reconciliation • stock reconciliation • expenses • audit trail</p></div><button class="btn" onclick="go('audit')">VIEW AUDIT TRAIL</button></div>${nav()}`}
function auditScreen(){return `<div class="screen">${header("Audit Trail")}${S.audit.slice(0,40).map(a=>`<div class="item"><div><b>${a.action}</b><small>${new Date(a.at).toLocaleString()} • ${a.role}<br>${a.detail}</small></div></div>`).join("")||"<p>No activity yet.</p>"}</div>${nav()}`}
function more(){return `<div class="screen">${header("More")}<div class="grid"><button class="tile" onclick="go('setup')"><b>⚙ Setup</b><small>Station configuration</small></button><button class="tile" onclick="go('staff')"><b>👥 Staff</b><small>Roles</small></button><button class="tile" onclick="go('accounts')"><b>₹ Accounts</b><small>Financial position</small></button><button class="tile" onclick="go('reports')"><b>▤ Reports</b><small>Management</small></button><button class="tile" onclick="go('receipts')"><b>🚚 Receipts</b><small>Fuel deliveries</small></button><button class="tile" onclick="go('expenses')"><b>Expense</b><small>Station expenses</small></button><button class="tile" onclick="go('audit')"><b>Audit</b><small>Activity history</small></button></div></div>${nav()}`}
function welcome(){return `<div class="screen" style="display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">PUMP0S</div><h1>Run your entire fuel station from one place.</h1><p>Sales • Stock • Shifts • Staff • Accounts</p><button class="btn" onclick="go('onboard')">GET STARTED</button><button class="later" onclick="go('dashboard')">Already have an account? Log in</button></div>`}
function onboard(){return `<div class="screen">${header("Station Ready")}<p>Demo station created. Configure the basics, then start the first shift.</p><div class="item"><div><b>${S.station.name}</b><small>${S.products.length} products • ${S.tanks.length} tanks • ${S.nozzles.length} nozzles</small></div><span class="pill ok">READY</span></div><button class="btn" onclick="audit('ONBOARDING_COMPLETE');go('dashboard')">ENTER PUMPOS</button></div>`}

/* PumpOS v11 feature extension */
S.credits=S.credits||[];
S.checklists=S.checklists||[];
S.maintenance=S.maintenance||[];
S.alerts=S.alerts||[];
S.priceHistory=S.priceHistory||[];
S.cashbook=S.cashbook||[];
S.documents=S.documents||[];
S.settings=S.settings||{autoLock:false,receiptPrint:false};

function customers(){
 return `<div class="screen">${header("Credit Customers")}
 <div class="form"><label>Customer / Fleet</label><input id="cn" placeholder="Name">
 <label>Mobile / Reference</label><input id="cm" placeholder="Optional">
 <label>Credit limit</label><input id="cl" type="number">
 <button class="btn" onclick="addCustomer()">ADD CUSTOMER</button></div>
 ${S.credits.slice(0,20).map(c=>`<div class="item"><div><b>${c.name}</b><small>${c.ref||""} • Limit ${money(c.limit)}</small></div><span>${money(c.outstanding)}</span></div>`).join("")}</div>${nav()}`;
}
function addCustomer(){if(!cn.value.trim())return toast("Enter customer");S.credits.unshift({id:"C"+Date.now(),name:cn.value.trim(),ref:cm.value,limit:+cl.value||0,outstanding:0});audit("CUSTOMER_ADD",cn.value);save();go("customers")}

function checklist(){
 const items=["Forecourt clean and safe","Emergency equipment checked","Price display verified","Tank/DIP readings checked","Nozzle meters checked","Cash drawer verified","POS/UPI devices working","Toilet / customer area checked"];
 return `<div class="screen">${header("Daily Checklist")}<p>Manager completes operational checks before and during the shift.</p>
 ${items.map((x,i)=>`<label class="item" style="display:flex;gap:10px"><input type="checkbox" ${S.checklists[i]?'checked':''} onchange="toggleCheck(${i},this.checked)"><span><b>${x}</b><small>Station control item</small></span></label>`).join("")}
 <div class="primary-card"><b>Completion</b><p>${S.checklists.filter(Boolean).length}/${items.length} checks complete</p></div></div>${nav()}`;
}
function toggleCheck(i,v){S.checklists[i]=v;audit("CHECKLIST",String(i+1));save()}

function maintenance(){
 return `<div class="screen">${header("Maintenance")}
 <div class="form"><label>Asset</label><input id="ma" placeholder="Dispenser / tank / canopy / generator">
 <label>Issue</label><input id="mi" placeholder="Describe issue">
 <label>Priority</label><select id="mp"><option>Normal</option><option>High</option><option>Critical</option></select>
 <label>Estimated cost</label><input id="mc" type="number">
 <button class="btn" onclick="addMaintenance()">LOG ISSUE</button></div>
 ${S.maintenance.slice(0,20).map(m=>`<div class="item"><div><b>${m.asset}</b><small>${m.issue} • ${m.priority} • ${new Date(m.at).toLocaleDateString()}</small></div><span>${money(m.cost)}</span></div>`).join("")}</div>${nav()}`;
}
function addMaintenance(){if(!ma.value||!mi.value)return toast("Enter asset and issue");S.maintenance.unshift({asset:ma.value,issue:mi.value,priority:mp.value,cost:+mc.value||0,status:"Open",at:new Date().toISOString()});audit("MAINTENANCE",ma.value);save();go("maintenance")}

function cashbook(){
 const entries=S.cashbook||[];
 return `<div class="screen">${header("Cashbook")}
 <div class="form"><label>Type</label><select id="ct"><option>Cash In</option><option>Cash Out</option></select><label>Category</label><input id="cc" placeholder="Petty cash / deposit / expense">
 <label>Amount</label><input id="ca" type="number"><label>Reference</label><input id="cr" placeholder="Optional"><button class="btn" onclick="addCash()">SAVE ENTRY</button></div>
 ${entries.slice(0,20).map(e=>`<div class="item"><div><b>${e.type}</b><small>${e.category} • ${e.ref||""}</small></div><span>${money(e.amount)}</span></div>`).join("")}</div>${nav()}`;
}
function addCash(){const a=+ca.value;if(a<=0)return toast("Enter amount");S.cashbook.unshift({type:ct.value,category:cc.value,amount:a,ref:cr.value,at:new Date().toISOString()});audit("CASHBOOK",`${ct.value} ${money(a)}`);save();go("cashbook")}

function priceHistory(){
 return `<div class="screen">${header("Price History")}
 <div class="form"><label>Product</label><select id="ph">${S.products.map(p=>`<option>${p.name}</option>`).join("")}</select><label>New selling price / L</label><input id="pr" type="number" step=".01"><label>Effective time</label><input id="pe" type="datetime-local"><button class="btn" onclick="setPrice()">UPDATE PRICE</button></div>
 ${S.priceHistory.slice(0,20).map(p=>`<div class="item"><div><b>${p.product}</b><small>${p.effective}</small></div><span>${money(p.price)}/L</span></div>`).join("")}</div>${nav()}`;
}
function setPrice(){const p=S.products.find(x=>x.name===ph.value),v=+pr.value;if(!p||v<=0)return toast("Enter valid price");S.priceHistory.unshift({product:p.name,price:v,effective:pe.value||new Date().toISOString()});p.price=v;audit("PRICE_CHANGE",`${p.name} ${money(v)}/L`);save();go("priceHistory")}

function alertsScreen(){
 const a=[];
 if(!S.activeShift)a.push(["Shift","No active shift","warning"]);
 if(S.tanks.some(t=>t.dip<=0))a.push(["Stock","Tank DIP not entered","warning"]);
 if(S.nozzles.some(n=>n.meter<=0))a.push(["Meters","Some nozzle totalizers are not configured","warning"]);
 if(S.maintenance.some(m=>m.status==="Open"&&m.priority==="Critical"))a.push(["Maintenance","Critical issue open","danger"]);
 return `<div class="screen">${header("Alerts & Controls")}${a.length?a.map(x=>`<div class="item"><div><b>${x[0]}</b><small class="${x[2]==="danger"?"danger":"warn"}">${x[1]}</small></div><span>!</span></div>`).join(""):`<div class="primary-card"><h3>All clear</h3><p>No current prototype alerts.</p></div>`}</div>${nav()}`;
}

function backup(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pumpos-backup.json";a.click();URL.revokeObjectURL(a.href);
 audit("BACKUP_EXPORT");toast("Backup exported");
}

function documents(){
 return `<div class="screen">${header("Documents")}
 <div class="primary-card"><h3>Station records</h3><p>Keep invoice references, receipts, permits and operational documents linked to the station.</p><button class="btn" onclick="backup()">EXPORT DATA BACKUP</button></div>
 ${S.documents.map(d=>`<div class="item"><div><b>${d.name}</b><small>${d.type} • ${d.ref||""}</small></div></div>`).join("")}</div>${nav()}`;
}

function security(){
 return `<div class="screen">${header("Security & Settings")}
 <div class="item"><div><b>Role-based access</b><small>Owner / Manager / Salesman</small></div><span class="pill">ON</span></div>
 <div class="item"><div><b>Audit trail</b><small>Important actions are recorded</small></div><span class="pill">ON</span></div>
 <div class="item"><div><b>Local persistence</b><small>Prototype saves state on this device</small></div><span class="pill">ON</span></div>
 <button class="btn" onclick="demoData()">CREATE DEMO SALE</button>
 <button class="btn" onclick="(function(){const r=testPrototype();toast(r.passed?"Prototype test passed":"Prototype test failed")})()">RUN FUNCTIONAL TEST</button>
 <button class="btn" onclick="backup()">EXPORT BACKUP</button>
 <button class="later" onclick="resetDemo()">RESET DEMO DATA</button></div>${nav()}`;
}
function resetDemo(){if(confirm("Reset this prototype to first-day demo data?")){localStorage.removeItem(KEY);location.reload()}}


function demoData(){
 if(!S.activeShift) openShift();
 const n=S.nozzles[0], rate=S.products.find(p=>p.name===n.product)?.price||95;
 if(!rate) S.products.find(p=>p.name===n.product).price=95;
 const opening=n.meter, closing=opening+25;
 const fake={id:"DEMO"+Date.now(),date:new Date().toISOString().slice(0,10),shift:S.activeShift.id,nozzle:n.id,product:n.product,opening,closing,litres:25,rate:rate||95,amount:25*(rate||95),payment:"Cash",at:new Date().toISOString(),demo:true};
 S.sales.push(fake); n.meter=closing;
 S.accounts.cash=(S.accounts.cash||0)+fake.amount;
 audit("DEMO_SALE",`${fake.litres}L ${fake.product} ${money(fake.amount)}`);
 save(); toast("Demo transaction created"); go("dashboard");
}
function testPrototype(){
 const before=S.sales.length;
 if(!S.activeShift){S.activeShift={id:"TESTSHIFT"+Date.now(),name:"Test Shift",duration:8,start:new Date().toISOString(),openingMeters:Object.fromEntries(S.nozzles.map(n=>[n.id,n.meter]))};S.shifts.unshift(S.activeShift)}
 const n=S.nozzles[0], product=S.products.find(p=>p.name===n.product)||S.products[0], rate=product.price||95, opening=n.meter, closing=opening+10;
 S.sales.push({id:"TEST"+Date.now(),date:new Date().toISOString().slice(0,10),shift:S.activeShift.id,nozzle:n.id,product:n.product,opening,closing,litres:10,rate,amount:10*rate,payment:"UPI",at:new Date().toISOString(),demo:true});
 n.meter=closing;
 S.accounts.bank=(S.accounts.bank||0)+10*rate;
 audit("PROTOTYPE_TEST","sale/meter/payment/persistence");
 save();
 return {passed:S.sales.length===before+1,meter:n.meter,sale:10*rate};
}

function render(){
 if(!canAccess(S.screen)) S.screen="dashboard";
 let out={welcome,onboard,dashboard,sales,shift,stock,receipts,reconcile,setup,stationEdit,productEdit,tankEdit,nozzleEdit,staff,role,accounts,expenses,reports,audit:auditScreen,more,customers,checklist,maintenance,cashbook,priceHistory,alerts:alertsScreen,documents,security}[S.screen];
 document.getElementById("app").innerHTML=out?out():"<div class='screen'><h2>Page unavailable</h2><button class='btn' onclick=\"go('dashboard')\">Dashboard</button></div>";
}
render();
</script></body></html>
