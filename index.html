<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fuel Station Credit App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --green:#1E8A3C;
    --green-dark:#146B2E;
    --green-light:#E7F5EA;
    --orange:#E07A1F;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#E7EAEE;
    --bg:#F4F6F8;
    --white:#FFFFFF;
    --danger:#D64545;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:#dfe3e7;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 12px;
    min-height:100vh;
  }
  .phone{
    width:390px;
    background:var(--bg);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.25);
    border:8px solid #14181f;
    position:relative;
    min-height:820px;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 22px 4px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    background:var(--bg);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 14px;
    background:var(--bg);
  }
  .topbar .back{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--white);border:1px solid var(--line);
    cursor:pointer;font-size:16px;color:var(--ink);
  }
  .topbar .title-wrap{flex:1;padding:0 12px;}
  .topbar h1{margin:0;font-size:17px;font-weight:700;color:var(--ink);}
  .topbar .sub{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
  .topbar .icon-btn{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--white);border:1px solid var(--line);
    font-size:15px;color:var(--ink);
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:0 18px 18px;
  }
  .greeting{padding:6px 18px 14px;}
  .greeting h2{margin:0;font-size:20px;color:var(--ink);}
  .greeting .status{
    display:flex;align-items:center;gap:6px;margin-top:4px;
    font-size:13px;color:var(--green-dark);font-weight:600;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
  .bell{
    width:38px;height:38px;border-radius:12px;background:var(--white);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    position:absolute;top:44px;right:18px;font-size:16px;
  }
  .shift-card{
    background:var(--white);border-radius:16px;border:1px solid var(--line);
    padding:16px;margin-bottom:16px;
  }
  .shift-card .row{display:flex;justify-content:space-between;align-items:center;}
  .shift-card .date{font-weight:700;color:var(--ink);font-size:15px;}
  .shift-card .time{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .shift-card .ends{
    background:var(--green-light);color:var(--green-dark);
    font-size:12px;font-weight:700;padding:6px 10px;border-radius:20px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .tile{
    background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;
    cursor:pointer;font-family:inherit;text-align:left;
  }
  .tile .ic{
    width:34px;height:34px;border-radius:10px;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--green-dark);
  }
  .tile span{font-size:14px;font-weight:600;color:var(--ink);}
  .bottomnav{
    display:flex;justify-content:space-around;align-items:center;
    background:var(--white);border-top:1px solid var(--line);
    padding:10px 6px 14px;
  }
  .navitem{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:11px;color:var(--ink-soft);background:none;border:none;cursor:pointer;font-family:inherit;
  }
  .navitem.active{color:var(--green-dark);font-weight:700;}
  .navitem .navic{font-size:17px;}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--white);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;color:var(--ink-soft);font-size:13px;
  }
  .summary-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--green-light);border:1px solid #cfeed7;border-radius:14px;
    padding:14px 16px;margin-bottom:18px;cursor:pointer;
  }
  .summary-banner .left{display:flex;align-items:center;gap:12px;}
  .summary-banner .ic{
    width:36px;height:36px;border-radius:10px;background:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--green-dark);
  }
  .summary-banner .t1{font-weight:700;font-size:14px;color:var(--green-dark);}
  .summary-banner .t2{font-size:12px;color:var(--green-dark);opacity:.8;}
  .section-label{font-size:13px;font-weight:700;color:var(--ink-soft);margin:6px 0 10px;}
  .cust-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;cursor:pointer;
  }
  .cust-row .left{display:flex;align-items:center;gap:12px;}
  .cust-row .avatar{
    width:38px;height:38px;border-radius:10px;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--green-dark);
  }
  .cust-row .name{font-weight:700;font-size:14px;color:var(--ink);}
  .cust-row .code{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .cust-row .amt{font-weight:700;font-size:14px;color:var(--ink);text-align:right;}
  .cust-row .tag{font-size:11px;color:var(--orange);font-weight:700;margin-top:2px;text-align:right;}
  .btn-primary{
    width:100%;background:var(--green);color:var(--white);border:none;
    border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{
    flex:1;background:var(--white);color:var(--ink);border:1px solid var(--line);
    border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .row-btns{display:flex;gap:12px;}
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:20px;text-align:center;margin-bottom:16px;
  }
  .stat-card .label{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-card .value{font-size:26px;font-weight:800;color:var(--green-dark);}
  .grid2-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .mini-stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .mini-stat .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .mini-stat .value{font-size:17px;font-weight:800;color:var(--ink);}
  .top-cust-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .top-cust-row:last-child{border-bottom:none;}
  .top-cust-row .n{font-weight:600;color:var(--ink);}
  .top-cust-row .v{font-weight:700;color:var(--ink);}
  .list-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:16px;}
  .info-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px;}
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--ink-soft);}
  .info-row .v{font-weight:700;color:var(--ink);}
  .info-row .v.credit{color:var(--green-dark);}
  .info-row .v.locked{display:flex;align-items:center;gap:6px;}
  .fuel-card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--white);border:2px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:12px;cursor:pointer;
  }
  .fuel-card.selected{border-color:var(--green);background:var(--green-light);}
  .fuel-card .left{display:flex;align-items:center;gap:12px;}
  .fuel-card .ic{
    width:38px;height:38px;border-radius:10px;background:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .fuel-card .name{font-weight:700;font-size:14px;color:var(--ink);}
  .fuel-card .price{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .radio{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .radio.on{border-color:var(--green);background:var(--green);color:white;font-size:13px;}
  .field-label{font-size:13px;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .field-box{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-bottom:14px;
  }
  .field-box.locked{background:#F5F6F7;}
  .field-row{display:flex;justify-content:space-between;align-items:center;}
  .field-row .lbl{font-size:13px;color:var(--ink-soft);}
  .field-row input{
    border:none;background:transparent;text-align:right;font-size:17px;font-weight:700;
    color:var(--ink);width:150px;outline:none;font-family:inherit;
  }
  .field-row .static{font-size:17px;font-weight:700;color:var(--ink);}
  .hint{font-size:12px;color:var(--ink-soft);margin:6px 2px 18px;line-height:1.5;}
  .select-box{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-bottom:14px;font-size:14px;font-weight:600;color:var(--ink);
  }
  .center-page{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px;}
  .status-icon{
    width:84px;height:84px;border-radius:50%;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--green-dark);
    margin-bottom:16px;
  }
  .status-icon.orange{background:#FCE9D6;color:var(--orange);}
  .status-title{font-size:19px;font-weight:800;color:var(--ink);margin:0 0 4px;}
  .status-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
  .txn-id{font-size:12px;color:var(--ink-soft);font-weight:700;background:var(--white);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;margin-bottom:22px;}
  .outstanding-note{
    background:#FFF7EC;border:1px solid #F5DCB0;border-radius:12px;
    padding:12px 14px;font-size:12px;color:#8A5A11;line-height:1.5;margin:10px 0 20px;text-align:left;
  }
  .plus{color:var(--green-dark);}
  a.reset{display:block;text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px;cursor:pointer;text-decoration:underline;}

  .select-box{cursor:pointer;position:relative;}
  .dropdown-list{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    margin:-6px 0 14px;overflow:hidden;
  }
  .dropdown-item{
    padding:13px 16px;font-size:14px;font-weight:600;color:var(--ink);
    border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;
  }
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item.active{color:var(--green-dark);background:var(--green-light);}

  .form-input{
    width:100%;background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:14px;
  }
  .form-input:focus{border-color:var(--green);}

  .menu-tile{
    display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;
  }
  .menu-tile .ic{width:38px;height:38px;border-radius:10px;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--green-dark);}
  .menu-tile .txt{flex:1;}
  .menu-tile .name{font-weight:700;font-size:14px;color:var(--ink);}
  .menu-tile .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .profile-head{display:flex;flex-direction:column;align-items:center;padding:16px 0 22px;}
  .profile-avatar{width:76px;height:76px;border-radius:50%;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--green-dark);margin-bottom:12px;}
  .profile-name{font-size:18px;font-weight:800;color:var(--ink);}
  .profile-role{font-size:13px;color:var(--ink-soft);margin-top:2px;}

  .segment-row{display:flex;gap:10px;margin-bottom:16px;}
  .segment{flex:1;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .segment.on{border-color:var(--green);color:var(--green-dark);background:var(--green-light);}

  .breakdown-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-row .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .breakdown-row .lbl{flex:1;font-size:13px;color:var(--ink);font-weight:600;}
  .breakdown-row .val{font-size:13px;font-weight:700;color:var(--ink);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ---------- Fixed data (kept exactly as shown in mockups) ---------- */
const CUSTOMERS_INITIAL = [
  { code: "AT-001", name: "Arun Traders",     outstanding: 37550.00, limit: 50000.00, lastTxn: "25 Aug 2026", totalSales: 124850.00, paymentsMade: 112400.00 },
  { code: "ST-002", name: "Sharma Transport", outstanding: 12450.00, limit: 40000.00, lastTxn: "24 Aug 2026", totalSales: 98200.00,  paymentsMade: 85750.00 },
  { code: "KE-003", name: "Kumar Enterprises",outstanding: 8760.00,  limit: 20000.00, lastTxn: "23 Aug 2026", totalSales: 41200.00,  paymentsMade: 32440.00 },
  { code: "RK-004", name: "R.K. Industries",  outstanding: 25000.00, limit: 45000.00, lastTxn: "22 Aug 2026", totalSales: 76300.00,  paymentsMade: 51300.00 },
];

const TODAY_SUMMARY = {
  totalCreditSales: 124850.00,
  totalTransactions: 18,
  totalQuantity: 1248.65,
  topCustomers: [
    { name: "Arun Traders", value: 45600.00 },
    { name: "Sharma Transport", value: 32450.00 },
    { name: "Kumar Enterprises", value: 18760.00 },
    { name: "Others", value: 28040.00 },
  ],
};

const FUELS = [
  { key: "petrol", name: "Petrol", rate: 105.20, icon: "⛽" },
  { key: "diesel", name: "Diesel", rate: 92.35, icon: "⛽" },
];

// Each fuel can be dispensed from more than one nozzle — this is now real,
// selectable data instead of a single hardcoded string.
const NOZZLES_BY_FUEL = {
  petrol: [
    { id: "N1", label: "N1 - Petrol" },
    { id: "N3", label: "N3 - Petrol" },
  ],
  diesel: [
    { id: "N2", label: "N2 - Diesel" },
    { id: "N4", label: "N4 - Diesel" },
  ],
};

const OPERATOR = "Saleem";
const SHIFT = "Morning Shift";
const SHIFT_WINDOW = "09:00 AM - 09:00 PM";

const inr = (n) => "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Real date/time helpers — replace the hardcoded "27 Aug 2026, 10:15 AM" values.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDate(d) {
  return `${String(d.getDate()).padStart(2,"0")} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function formatTime(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,"0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}
function formatDateTime(d) {
  return `${formatDate(d)}, ${formatTime(d)}`;
}
// Transaction ID format: TX-DDMMYY-#### (sequence resets conceptually per day; kept simple with an in-session counter)
function makeTxnId(d, seq) {
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yy = String(d.getFullYear()).slice(-2);
  return `TX-${dd}${mm}${yy}-${String(1000 + seq)}`;
}

/* ---------- Shared shell ---------- */
function Phone({ children }) {
  return (
    <div className="phone">
      <div className="statusbar">
        <span>9:41</span>
        <span>📶 🛜 🔋</span>
      </div>
      {children}
    </div>
  );
}

function TopBar({ title, sub, onBack, right }) {
  return (
    <div className="topbar">
      {onBack ? <button className="back" onClick={onBack}>‹</button> : <div style={{width:34}}></div>}
      <div className="title-wrap">
        <h1>{title}</h1>
        {sub && <p className="sub">{sub}</p>}
      </div>
      {right ? right : <div style={{width:34}}></div>}
    </div>
  );
}

function BottomNav({ active, onHome, onOps, onSummary, onDigital }) {
  const items = [
    { key: "home", label: "Home", icon: "🏠", onClick: onHome },
    { key: "digital", label: "Digital Transactions", icon: "📇", onClick: onDigital },
    { key: "ops", label: "Operations", icon: "🗂️", onClick: onOps },
    { key: "summary", label: "Summary", icon: "📊", onClick: onSummary },
  ];
  return (
    <div className="bottomnav">
      {items.map(it => (
        <button key={it.key} className={"navitem" + (active === it.key ? " active" : "")} onClick={it.onClick}>
          <span className="navic">{it.icon}</span>
          <span>{it.label}</span>
        </button>
      ))}
    </div>
  );
}

/* ---------- 1. Home ---------- */
/* Note: Home screen's own bottom nav in the mockup is Home / Shift Status / Close Shift / Profile,
   distinct from the other screens' nav (Home / Digital Transactions / Operations / Summary). */
function HomeBottomNav({ go }) {
  return (
    <div className="bottomnav">
      <button className="navitem active"><span className="navic">🏠</span><span>Home</span></button>
      <button className="navitem" onClick={() => go("shift-status")}><span className="navic">🕒</span><span>Shift Status</span></button>
      <button className="navitem" onClick={() => go("close-shift")}><span className="navic">🔒</span><span>Close Shift</span></button>
      <button className="navitem" onClick={() => go("profile")}><span className="navic">👤</span><span>Profile</span></button>
    </div>
  );
}
function HomeScreenFixed({ go }) {
  return (
    <Phone>
      <div className="bell">🔔</div>
      <div className="greeting">
        <h2>Hello, Saleem</h2>
        <div className="status"><span className="dot"></span>Your Shift Is Active</div>
      </div>
      <div className="content" style={{paddingTop:4}}>
        <div className="shift-card">
          <div className="row">
            <div>
              <div className="date">📅 {formatDate(new Date())}</div>
              <div className="time">{SHIFT_WINDOW}</div>
            </div>
            <div className="ends">Ends In<br/>08h 42m</div>
          </div>
        </div>

        <div className="grid2">
          <button className="tile" onClick={() => go("credit-customers")}>
            <div className="ic">👥</div>
            <span>Credit Customers</span>
          </button>
          <button className="tile" onClick={() => go("digital")}>
            <div className="ic">💳</div>
            <span>Digital Transactions</span>
          </button>
          <button className="tile" onClick={() => go("ops")}>
            <div className="ic">📋</div>
            <span>Operations</span>
          </button>
          <button className="tile" onClick={() => go("summary")}>
            <div className="ic">📈</div>
            <span>Summary</span>
          </button>
        </div>
      </div>
      <HomeBottomNav go={go} />
    </Phone>
  );
}

/* ---------- 2 / 10. Credit Customers ---------- */
function CreditCustomersScreen({ go, customers }) {
  return (
    <Phone>
      <TopBar title="Credit Customers" onBack={() => go("home")} right={<button className="icon-btn">🔔</button>} />
      <div className="content">

/* ---------- 5. Select Fuel & Nozzle ---------- */
function SelectFuelScreen({ go, customer, sale, setSale }) {
  const [nozzleOpen, setNozzleOpen] = useState(false);
  const nozzleOptions = NOZZLES_BY_FUEL[sale.fuel];
  const currentNozzle = nozzleOptions.find(n => n.id === sale.nozzle) || nozzleOptions[0];

  const chooseFuel = (fuelKey) => {
    // Changing fuel resets the nozzle to that fuel's first nozzle, since a
    // petrol nozzle can't dispense diesel.
    setSale(s => ({ ...s, fuel: fuelKey, nozzle: NOZZLES_BY_FUEL[fuelKey][0].id }));
    setNozzleOpen(false);
  };

  return (
    <Phone>
      <TopBar title="New Sale" sub={`${customer.name} (${customer.code})`} onBack={() => go("customer-overview", { code: customer.code })} />
      <div className="content">
        <div className="field-label" style={{marginTop:6}}>Select Fuel</div>
        {FUELS.map(f => (
          <div key={f.key} className={"fuel-card" + (sale.fuel === f.key ? " selected" : "")} onClick={() => chooseFuel(f.key)}>
            <div className="left">
              <div className="ic">{f.icon}</div>
              <div>
                <div className="name">{f.name}</div>
                <div className="price">{inr(f.rate)} / L</div>
              </div>
            </div>
            <div className={"radio" + (sale.fuel === f.key ? " on" : "")}>{sale.fuel === f.key ? "✓" : ""}</div>
          </div>
        ))}

        <div className="field-label" style={{marginTop:16}}>Select Nozzle</div>
        <div className="select-box" onClick={() => setNozzleOpen(o => !o)}>
          <span>{currentNozzle.label}</span>
          <span>{nozzleOpen ? "▴" : "▾"}</span>
        </div>
        {nozzleOpen && (
          <div className="dropdown-list">
            {nozzleOptions.map(n => (
              <div
                key={n.id}
                className={"dropdown-item" + (n.id === currentNozzle.id ? " active" : "")}
                onClick={() => { setSale(s => ({ ...s, nozzle: n.id })); setNozzleOpen(false); }}
              >
                <span>{n.label}</span>
                {n.id === currentNozzle.id && <span>✓</span>}
              </div>
            ))}
          </div>
        )}

        <button className="btn-primary" style={{marginTop:10}} onClick={() => go("sale-details", { code: customer.code })}>Continue →</button>
      </div>
    </Phone>
  );
}

/* ---------- 6. Enter Sale Details ---------- */
function SaleDetailsScreen({ go, customer, sale, setSale }) {
  const fuel = FUELS.find(f => f.key === sale.fuel);

  const onAmountChange = (val) => {
    const amt = parseFloat(val) || 0;
    const qty = fuel.rate > 0 ? amt / fuel.rate : 0;
    setSale(s => ({ ...s, amount: val, quantity: qty.toFixed(2) }));
  };
  const onQuantityChange = (val) => {
    const qty = parseFloat(val) || 0;
    const amt = qty * fuel.rate;
    setSale(s => ({ ...s, quantity: val, amount: amt.toFixed(2) }));
  };

  return (

/* ---------- App shell / router ---------- */
function App() {
  const [screen, setScreen] = useState("home");
  const [selectedCode, setSelectedCode] = useState(null);
  const [customers, setCustomers] = useState(CUSTOMERS_INITIAL);
  const [sale, setSale] = useState({ fuel: "petrol", nozzle: "N1", amount: "1052.00", quantity: "10.00" });
  const [txnSeq, setTxnSeq] = useState(1); // increments with each completed sale, feeds the transaction ID
  const [lastTxn, setLastTxn] = useState(null); // { id, time } for the most recently confirmed sale

  const go = (next, params = {}) => {
    if (params.code) setSelectedCode(params.code);
    // Generate the real transaction record exactly once, at the moment the sale is confirmed,
    // so the ID/timestamp shown on New Outstanding and Sale Completed match each other.
    if (params.confirmSale) {
      const now = new Date();
      setLastTxn({ id: makeTxnId(now, txnSeq), time: now });
      setTxnSeq(seq => seq + 1);
    }
    setScreen(next);
    window.scrollTo(0,0);
  };

  const customer = useMemo(() => customers.find(c => c.code === selectedCode), [customers, selectedCode]);

  const applySaleToOutstanding = () => {
    const amt = parseFloat(sale.amount) || 0;
    const dateLabel = lastTxn ? formatDate(lastTxn.time) : formatDate(new Date());
    setCustomers(cs => cs.map(c => c.code === selectedCode ? { ...c, outstanding: c.outstanding + amt, lastTxn: dateLabel } : c));
  };

  const addCustomer = (newCust) => {
    setCustomers(cs => [newCust, ...cs]);
  };

  const resetDemo = () => {
    setCustomers(CUSTOMERS_INITIAL);
    setSale({ fuel: "petrol", nozzle: "N1", amount: "1052.00", quantity: "10.00" });
    setTxnSeq(1);
    setLastTxn(null);
    setScreen("home");
  };

  let view;
  switch (screen) {
    case "home": view = <HomeScreenFixed go={go} />; break;
    case "credit-customers": view = <CreditCustomersScreen go={go} customers={customers} />; break;
    case "today-summary": view = <TodaySummaryScreen go={go} />; break;
    case "customer-overview": view = <CustomerOverviewScreen go={go} customer={customer} />; break;
    case "select-fuel": view = <SelectFuelScreen go={go} customer={customer} sale={sale} setSale={setSale} />; break;
    case "sale-details": view = <SaleDetailsScreen go={go} customer={customer} sale={sale} setSale={setSale} />; break;
    case "review-sale": view = <ReviewSaleScreen go={go} customer={customer} sale={sale} />; break;
    case "new-outstanding": view = <NewOutstandingScreen go={go} customer={customer} sale={sale} />; break;
    case "sale-success": view = <SaleSuccessScreen go={go} customer={customer} sale={sale} txn={lastTxn} onDone={applySaleToOutstanding} />; break;
    case "digital": view = <DigitalTransactionsScreen go={go} />; break;
    case "ops": view = <OperationsScreen go={go} />; break;
    case "summary": view = <SummaryScreen go={go} customers={customers} />; break;
    case "add-customer": view = <AddCustomerScreen go={go} onAdd={addCustomer} />; break;
    case "shift-status": view = <ShiftStatusScreen go={go} />; break;
    case "close-shift": view = <CloseShiftScreen go={go} customers={customers} />; break;
    case "profile": view = <ProfileScreen go={go} />; break;
    default: view = <HomeScreenFixed go={go} />;
  }

  return (
    <div>
      {view}
      <a className="reset" onClick={resetDemo}>Reset demo data</a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
