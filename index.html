<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PumpOS Salesman Module</title>
<style>
:root{--n:#073f4b;--b:#0b56c9;--g:#159447;--bg:#f5f7f8;--line:#dce5e9}
*{box-sizing:border-box}body{margin:0;background:#e8edef;font-family:Arial,sans-serif;color:#132027}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg)}
header{height:62px;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}
main{padding:18px 15px 92px}h1{font-size:22px;margin:0 0 6px}h2{font-size:18px}p{font-size:13px;color:#66757d}.card,.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.item{display:flex;align-items:center;gap:10px;cursor:pointer}.item b{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 8px;text-align:center;font-weight:800;cursor:pointer}.ico{font-size:27px;display:block;margin-bottom:7px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f2;font-size:13px}.row:last-child{border:0}.v{font-weight:800;text-align:right}.btn{width:100%;border:0;border-radius:11px;padding:13px;margin-top:10px;background:var(--n);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.blue{background:var(--b)}.green{background:var(--g)}.light{background:#fff;color:var(--n);border:1px solid #b9cbd1}.input{width:100%;height:46px;border:1px solid #ccd8dd;border-radius:10px;padding:0 12px;margin:5px 0 11px;font-size:15px}.label{font-size:12px;font-weight:800}.success{text-align:center;padding:40px 8px}.check{width:74px;height:74px;border-radius:50%;background:var(--g);color:#fff;font-size:46px;display:grid;place-items:center;margin:auto}.nav{position:fixed;bottom:0;width:min(100%,430px);height:70px;background:#fff;border-top:1px solid #d9e1e5;display:grid;grid-template-columns:repeat(4,1fr);z-index:8}.nav button{border:0;background:#fff;font-size:10px;font-weight:700;color:#65747b}.nav .active{color:var(--b)}.nav span{display:block;font-size:19px;margin-bottom:3px}.homehead{display:flex;justify-content:space-between}.count{text-align:right}.count strong{display:block;font-size:24px;margin-top:4px}.summaryTotal{background:#edf8f0;border:1px solid #cce6d3;border-radius:14px;text-align:center;padding:15px}.summaryTotal b{display:block;font-size:25px;color:var(--g);margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#6d7b82;font-size:12px}
</style></head><body><div class="app" id="app"></div>
<script>
let screenName='login',flow='normal',customer=null;
const customers=[['AT','Aarun Traders','CUS1001','₹37,550','₹12,450'],['SS','ShaktiKiran Store','CUS1002','₹25,000','₹8,250'],['RE','Raju Enterprises','CUS1003','₹42,100','₹5,600'],['MM','Modern Market','CUS1004','₹31,500','₹9,850']];
function nav(){
 let a=flow==='credit'?['home','digital','operations','summary']:
 flow==='digital'?['home','credit','operations','summary']:
 flow==='operations'?['home','credit','digital','summary']:
 flow==='summary'?['home','credit','digital','operations']:
 ['home','shift','close','profile'];
 let names={home:'Home',shift:'Shift Status',close:'Close Shift',profile:'Profile',credit:'Credit Customers',digital:'Digital Transactions',operations:'Operations',summary:'Summary'};
 return '<div class="nav">'+a.map(x=>'<button class="'+(x===flow?'active':'')+'" onclick="go(\''+x+'\')"><span>'+({home:'⌂',shift:'◷',close:'▣',profile:'♙',credit:'♙',digital:'▣',operations:'⚙',summary:'◔'}[x])+'</span>'+names[x]+'</button>').join('')+'</div>'
}
function head(t='PumpOS'){return '<header><span>‹</span><b>⛽ '+t+'</b><span>♧</span></header>'}
function frame(body,title='PumpOS'){document.getElementById('app').innerHTML=head(title)+'<main>'+body+'</main>'+((screenName==='login'||['shiftStart','machine','opening','verify','started'].includes(screenName))?'':nav())}
function btn(t,f,c=''){return '<button class="btn '+c+'" onclick="'+f+'">'+t+'</button>'}
function rows(a){return a.map(x=>'<div class="row"><span>'+x[0]+'</span><span class="v">'+x[1]+'</span></div>').join('')}
function go(x){flow=x==='home'?'normal':x;screenName=x==='home'?'home':({credit:'credit',digital:'digital',operations:'operations',summary:'summary',shift:'shiftStatus',close:'close',profile:'profile'}[x]||x);render()}
function render(){
 if(screenName==='login')return frame('<div style="text-align:center;padding:35px 0;color:white;background:#082f73;border-radius:0 0 20px 20px"><div style="font-size:55px">⛽</div><b style="font-size:28px">ASIAN</b><div>FILLING STATION</div></div><div class="card" style="margin-top:18px"><h1 style="text-align:center">Login</h1><div class="grid"><button class="btn blue">Owner</button><button class="btn light">Manager</button></div><label class="label">User ID</label><input class="input" placeholder="User ID"><label class="label">Password</label><input class="input" type="password" placeholder="Password">'+btn('Login',"screenName='shiftStart';render()",'blue')+'</div>');
 if(screenName==='shiftStart')return frame('<h1>Select Shift</h1><p>Choose Your Shift Type to Start the Day.</p>'+['24 Hours Shift','12 Hours Shift','Morning Shift','Evening Shift','Night Shift'].map((x,i)=>'<div class="item"><b>'+x+'</b><span>○</span></div>').join('')+btn('Next',"screenName='machine';render()",'blue'));
 if(screenName==='machine')return frame('<h1>Select Machine</h1><p>Choose The Machine You Will Operate.</p>'+['M1 — Petrol — 2 Nozzles','M2 — Petrol — 2 Nozzles','M3 — Diesel — 2 Nozzles','M4 — Diesel — 2 Nozzles'].map((x,i)=>'<div class="item"><b>'+x+'</b><span>○</span></div>').join('')+btn('Next',"screenName='opening';render()",'blue'));
 if(screenName==='opening')return frame('<h1>Opening Meter</h1><p>Opening Meter Is Auto-Filled From Last Closing.</p><div class="card">'+rows([['Machine','M1 — Petrol'],['Nozzle','N1 — Petrol'],['Opening Meter','10,000.00 L'],['Opening Meter Time','27 Aug 2026, 09:00 AM']])+'</div>'+btn('Next',"screenName='verify';render()",'blue'));
 if(screenName==='verify')return frame('<h1>Verify Opening</h1><p>Please Verify All Details Before Starting The Shift.</p><div class="card">'+rows([['Shift Type','24 Hours Shift'],['Machine','M1 — Petrol'],['Nozzle','N1 — Petrol'],['Opening Meter','10,000.00 L']])+'</div>'+btn('Verify & Start',"screenName='started';render()",'blue'));
 if(screenName==='started')return frame('<div class="success"><div class="check">✓</div><h2>Shift Started Successfully!</h2><p>Your Shift Has Been Started.</p></div>'+btn('Go to Dashboard',"screenName='home';flow='normal';render()",'blue'));
 if(screenName==='home')return home();
 if(screenName==='credit')return creditList();
 if(screenName==='cstatus')return cstatus();
 if(screenName==='cfuel')return cfuel();
 if(screenName==='cqty')return cqty();
 if(screenName==='creview')return creview();
 if(screenName==='cout')return cout();
 if(screenName==='csuccess')return csuccess();
 if(screenName==='digital')return digital();
 if(screenName==='dreview')return dreview();
 if(screenName==='dconfirm')return dconfirm();
 if(screenName==='dsuccess')return dsuccess();
 if(screenName==='dlist')return dlist();
 if(screenName==='operations')return operations();
 if(screenName==='nat')return nat();
 if(screenName==='expenses')return expenses();
 if(screenName==='others')return others();
 if(screenName==='opsuccess')return opsuccess();
 if(screenName==='summary')return summary();
 if(screenName==='meters')return meters();
 if(screenName==='shiftStatus')return shiftStatus();
 if(screenName==='close')return closeShift();
 if(screenName==='profile')return profile();
}
function home(){frame('<div class="homehead"><div><h1>Hello, Saleem</h1><b style="color:#159447">Your Shift Is Active</b><p>27 Aug 2026</p><b>09:00 AM – 09:00 AM</b></div><div class="count"><small>24H</small><small>ENDS IN</small><strong>08h 42m</strong></div></div><div class="card"><b>Current Shift</b>'+rows([['Machine / Nozzle','M1 / N1 — Petrol'],['Opening Meter','10,000.00 L']])+'</div><div class="grid"><div class="tile" onclick="go(\'credit\')"><span class="ico">♙</span>Credit Customers</div><div class="tile" onclick="go(\'digital\')"><span class="ico">▣</span>Digital Transactions</div><div class="tile" onclick="go(\'operations\')"><span class="ico">⚙</span>Operations</div><div class="tile" onclick="go(\'summary\')"><span class="ico">◔</span>Summary</div></div>')}
function creditList(){frame('<h1>Credit Customers</h1><p>Search And Select A Customer.</p><input class="input" placeholder="Search Customer...">'+customers.map((c,i)=>'<div class="item" onclick="customer=customers['+i+'];screenName=\'cstatus\';render()"><span>'+c[0]+'</span><b>'+c[1]+'<small class="muted">'+c[2]+'</small></b><span>›</span></div>').join('')+btn('Add Customers',"alert('Add Customer Form')",'green'),'Credit Customers')}
function cstatus(){frame('<h1>Customer Overview</h1><p>Selected Customer: <b>'+customer[1]+'</b> ('+customer[2]+')</p><div class="card">'+rows([['Available Credit',customer[3]],['Previous Outstanding',customer[4]]])+'</div>'+btn('Next',"screenName='cfuel';render()",'blue'),'Credit Customers')}
function cfuel(){frame('<h1>Fuel & Nozzle</h1><p>Select Fuel And Nozzle Accordingly.</p>'+['Petrol','Diesel','Power'].map(x=>'<div class="item"><b>⛽ '+x+'</b><span>○</span></div>').join('')+'<label class="label">Nozzle</label><select class="input"><option>N1 — Petrol</option><option>N2 — Petrol</option></select>'+btn('Next',"screenName='cqty';render()",'blue'),'Credit Customers')}
function cqty(){frame('<h1>Amount / Rate / Quantity</h1><p>Amount Is Above Rate And Quantity. Fill Either Amount Or Quantity; The Other Adjusts Automatically.</p><label class="label">Amount (₹)</label><input class="input" value="1052.00"><label class="label">Rate (₹ / L)</label><input class="input" value="105.20"><label class="label">Quantity (L)</label><input class="input" value="10.00">'+btn('Save & Continue',"screenName='creview';render()",'blue'),'Credit Customers')}
function creview(){frame('<h1>Credit Entry Review</h1><div class="card">'+rows([['Customer',customer[1]],['Fuel','Petrol'],['Nozzle','N1 — Petrol'],['Amount','₹ 1,052.00'],['Rate','₹ 105.20'],['Quantity','10.00 L']])+'</div>'+btn('Confirm & Close',"screenName='cout';render()",'green'),'Credit Customers')}
function cout(){frame('<h1>New Outstanding</h1><div class="card">'+rows([['Previous Outstanding','₹ 12,450.00'],['+ New Credit Sale','₹ 1,052.00'],['New Outstanding','₹ 13,502.00']])+'</div>'+btn('Confirm & Close',"screenName='csuccess';render()",'green'),'Credit Customers')}
function csuccess(){frame('<div class="success"><div class="check">✓</div><h2>Credit Sale Added Successfully.</h2><p>The Credit Sale Has Been Recorded.</p></div>'+btn('Return to Customers',"screenName='credit';render()",'green')+btn('Go to Home',"screenName='home';flow='normal';render()",'blue'),'Credit Customers')}
function digital(){frame('<h1>Digital Transactions</h1><p>Enter Shift-End Digital Collection Totals.</p><div class="card">'+['UPI Total','Card Total','Bank / Fleet Total'].map((x,i)=>'<label class="label">'+x+' (₹)</label><input class="input" value="'+[12450,7850,4200][i].toLocaleString()+'">').join('')+'</div>'+btn('Next',"screenName='dreview';render()",'blue'),'Digital Transactions')}
function dreview(){frame('<h1>Review Digital Totals</h1><div class="card">'+rows([['UPI Total','₹ 12,450.00'],['Card Total','₹ 7,850.00'],['Bank / Fleet Total','₹ 4,200.00']])+'</div><div class="summaryTotal">Digital Total<b>₹ 24,500.00</b></div>'+btn('Next',"screenName='dconfirm';render()",'blue'),'Digital Transactions')}
function dconfirm(){frame('<h1>Confirm Digital Totals</h1><p>Are You Sure You Want to Save These Digital Totals for This Shift?</p><div class="summaryTotal">Digital Total<b>₹ 24,500.00</b></div>'+btn('Confirm & Close',"screenName='dsuccess';render()",'green'),'Digital Transactions')}
function dsuccess(){frame('<div class="success"><div class="check">✓</div><h2>Digital Transactions Saved Successfully.</h2></div>'+btn('Done',"screenName='dlist';render()",'blue'),'Digital Transactions')}
function dlist(){frame('<h1>Digital Transactions</h1><div class="card"><b>27 Aug 2026 — 24 Hours Shift</b>'+rows([['Digital Total','₹ 24,500.00'],['UPI Total','₹ 12,450.00'],['Card Total','₹ 7,850.00'],['Bank / Fleet Total','₹ 4,200.00']])+'</div>'+btn('Go to Home',"screenName='home';flow='normal';render()",'blue'),'Digital Transactions')}
function operations(){frame('<h1>Operations</h1><p>Select An Operation.</p>'+[['NAT','nat'],['Expenses','expenses'],['Others','others']].map(x=>'<div class="item" onclick="screenName=\''+x[1]+'\';render()"><b>'+x[0]+'</b><span>›</span></div>').join(''),'Operations')}
function nat(){frame('<h1>Nozzle Accuracy Test (NAT)</h1><label class="label">Nozzle</label><select class="input"><option>N1 — Petrol</option></select><label class="label">Dispensed Quantity (L)</label><input class="input" value="10.00"><label class="label">Actual Measured Quantity (L)</label><input class="input" value="10.02">'+btn('Save',"screenName='opsuccess';render()",'green'),'Operations')}
function expenses(){frame('<h1>Expenses</h1><label class="label">Expense Category</label><select class="input"><option>Select Category</option></select><label class="label">Amount (₹)</label><input class="input" placeholder="Enter Amount"><label class="label">Note (Optional)</label><input class="input" placeholder="Enter Note">'+btn('Save',"screenName='opsuccess';render()",'green'),'Operations')}
function others(){frame('<h1>Others</h1><label class="label">Type</label><select class="input"><option>Select Type</option></select><label class="label">Description</label><input class="input" placeholder="Enter Details"><label class="label">Amount (₹) (Optional)</label><input class="input" placeholder="Enter Amount">'+btn('Save',"screenName='opsuccess';render()",'green'),'Operations')}
function opsuccess(){frame('<div class="success"><div class="check">✓</div><h2>Entry Saved Successfully.</h2><p>Your Entry Has Been Recorded.</p></div>'+btn('Return to Operations',"screenName='operations';render()",'green')+btn('Go to Home',"screenName='home';flow='normal';render()",'blue'),'Operations')}
function summary(){frame('<h1>Summary</h1><p>This Is A Shift Review. It Does Not Close The Shift.</p><div class="card"><b>Fuel Summary</b><div class="two"><b>MS</b><b style="text-align:right">HSD</b></div>'+['Total Dispensed','NAT / Test','Net Sale','Sale Amount'].map((x,i)=>'<div class="row"><span>'+x+'</span><span></span></div><div class="two"><b>'+['1,250.00 L','10.02 L','1,239.98 L','₹ 1,30,197.90'][i]+'</b><b style="text-align:right">'+['980.00 L','5.01 L','974.99 L','₹ 91,123.80'][i]+'</b></div>').join('')+'</div><div class="summaryTotal">Total Sale Amount<b>₹ 2,21,321.70</b></div><div class="two"><button class="btn light" onclick="screenName=\'meters\';render()">View Meters ›</button><button class="btn light" onclick="screenName=\'meters\';render()">View Meters ›</button></div><div class="card"><b>Collection</b><h2>₹ 2,24,871.70</h2>'+btn('View Details ›',"alert('Digital • Credit • Expenses • Total Collection')",'light')+'</div><div class="card"><b>Cash Reconciliation</b>'+rows([['Expected Cash','₹ 75,000.00'],['Actual Cash','₹ 74,500.00'],['Variance','– ₹ 500.00']])+'</div>','Summary')}
function meters(){frame('<h1>Meter Details</h1><div class="card"><b>MS</b>'+rows([['Opening Meter','10,000.00 L'],['Closing Meter','11,250.00 L'],['Total Dispensed','1,250.00 L']])+'</div><div class="card"><b>HSD</b>'+rows([['Opening Meter','8,000.00 L'],['Closing Meter','8,980.00 L'],['Total Dispensed','980.00 L']])+'</div>','Summary')}
function shiftStatus(){frame('<h1>Shift Status</h1><div class="card"><b style="color:#159447">SHIFT ONGOING</b>'+rows([['Shift Type','24 Hours Shift'],['Shift ID','MS-270826-01'],['Start Time','27 Aug 2026, 09:00 AM'],['End Time','28 Aug 2026, 09:00 AM'],['Machine / Nozzle','M1, N1'],['Machine Status','All Machines Online'],['Pending Action / Alert','None']])+'</div>','Shift Status')}
function closeShift(){frame('<h1>Close Shift – Checklist</h1><p>Please Complete All Pending Items Before Closing The Shift.</p><div class="card">'+rows([['NAT / Test Recording','Completed'],['Digital Transactions Total','Completed'],['Expenses Entry','Completed'],['Cash Reconciliation','Completed'],['Closing Meter','Completed'],['Auto Sales Calculation','Completed'],['Credit Reconciliation','Completed']])+'</div>'+btn('Confirm & Close',"alert('Closing Meter Is Locked After Reading Is Filled and Done.')",'green'),'Close Shift')}
function profile(){frame('<h1>Profile</h1><div class="card"><h2>Salesman</h2><p>Employee ID: EMP00123</p><p>Role: Salesman</p></div>'+['Salesman Profile','Employee Details','Security','Settings','Help & Support','About PumpOS'].map(x=>'<div class="item"><b>'+x+'</b><span>›</span></div>').join('')+btn('Logout',"screenName='login';flow='normal';render()",'light'),'Profile')}
render();
</script></body></html>
