<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PumpOS Owner</title>
<style>
:root{--bg:#F8F7F2;--navy:#1a2332;--green:#5FA83E;--gray:#5a6472;--border:#e5e3da;--white:#fff;--amber:#b87931;--red:#b94b43}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#d9d9d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy)}
button{font:inherit}
.app{width:390px;max-width:100%;min-height:100vh;margin:auto;background:var(--bg)}
.top{height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#faf9f5;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top-title{font-size:17px;font-weight:750}.icon-btn{width:38px;height:38px;border:0;background:transparent;color:var(--navy);font-size:23px;border-radius:10px}
main{padding:18px 16px 96px}.eyebrow{font-size:11px;color:var(--gray);margin-bottom:4px}.title{font-size:25px;line-height:1.15;margin:0 0 5px;font-weight:800}.muted{font-size:11px;color:var(--gray);margin:0}
.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0 12px;padding-bottom:2px}.tabs button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;font-size:10px;font-weight:700;white-space:nowrap}.tabs .selected{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:0 2px 10px rgba(26,35,50,.05)}.metric small{display:block;color:var(--gray);font-size:10px}.metric strong{display:block;font-size:17px;margin-top:5px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(26,35,50,.05)}
.section{font-size:12px;font-weight:800;margin:18px 0 8px}.row{background:#fff;border:1px solid var(--border);border-radius:14px;min-height:54px;padding:11px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(26,35,50,.04);cursor:pointer}.row-left{min-width:0}.row-title{font-size:11px;font-weight:700}.row-sub{display:block;color:var(--gray);font-size:9px;margin-top:3px}.value{font-size:10px;font-weight:800;text-align:right;margin-left:10px}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0eee8;font-size:11px}.kv:last-child{border-bottom:0}
.primary{width:100%;height:48px;margin-top:10px;border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:800}.outline{width:100%;height:48px;margin-top:10px;border:1px solid #aeb4b2;border-radius:13px;background:#fff;color:var(--navy);font-weight:750}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:390px;max-width:100%;height:78px;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;color:#69727c;font-size:8px;font-weight:700}.bottom span{display:block;font-size:18px;height:25px}.bottom .active{color:var(--green)}
input{width:100%;height:44px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 10px;color:var(--navy)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
const A=document.getElementById("app");
let current="home",period="Today";

function nav(active){
return `<div class="bottom">
<button class="${active==="home"?"active":""}" onclick="go('home')"><span>⌂</span>Home</button>
<button class="${active==="summary"?"active":""}" onclick="go('summary')"><span>▥</span>Summary</button>
<button class="${active==="alerts"?"active":""}" onclick="go('alerts')"><span>!</span>Alerts</button>
<button class="${active==="settings"?"active":""}" onclick="go('settings')"><span>⚙</span>Settings</button>
<button class="${active==="profile"?"active":""}" onclick="go('profile')"><span>♙</span>Profile</button>
</div>`;
}
function shell(title,body,active="home",back=true){
A.innerHTML=`<header class="top"><button class="icon-btn" onclick="${back?"go('home'):"void(0)"}">${back?"‹":" "}</button><div class="top-title">${title}</div><button class="icon-btn">♙</button></header><main>${body}</main>${nav(active)}`;
}
function tabs(){
return `<div class="tabs">${["Today","This Week","This Month","Custom"].map(x=>`<button class="${period===x?"selected":""}" onclick="setPeriod('${x}')">${x}</button>`).join("")}</div>`;
}
window.setPeriod=x=>{period=x;if(x==="Custom"){custom()}else render()};
window.go=x=>{current=x;render()};
function home(){
shell("Owner",
`<div class="eyebrow">Asian Filling Station · Owner view</div>
<h1 class="title">Good evening</h1><p class="muted">Station monitoring at a glance</p>
${tabs()}
<div class="grid">
<div class="metric"><small>Today sales</small><strong>₹4,86,250</strong></div>
<div class="metric"><small>Fuel volume</small><strong>59,910 L</strong></div>
<div class="metric"><small>Digital collections</small><strong>₹2,14,680</strong></div>
<div class="metric"><small>Credit outstanding</small><strong class="amber">₹1,28,400</strong></div>
</div>
<div class="card"><h2 style="font-size:15px;margin:0 0 8px">Today at a glance</h2>
${row("Salesmen","3 active · all shifts open","Normal","green","salesmen")}
${row("Digital transactions","₹2,14,680 collected","Updated","green","digital")}
${row("Credit customers","₹1,28,400 outstanding","Review","amber","credit")}
${row("Pumps & meters","4 online · 1 variance","Review","amber","pumps")}
</div>
<div class="section">Owner monitoring</div>
${row("Operations","Station activity and controls","›","","operations")}
${row("Summary","Today, weekly, monthly or custom","›","","summary")}
${row("Exceptions & alerts","2 items require attention","2","amber","alerts")}
${row("Audit history","Recent changes and approvals","›","","audit")}
<div class="section">Controls</div>
${row("Settings","Permissions and operational controls","›","","settings")}`,
"home",false);
}
function row(t,s,v,c,action){return `<div class="row" onclick="go('${action}')"><div class="row-left"><span class="row-title">${t}</span><span class="row-sub">${s}</span></div><b class="value ${c||""}">${v}</b></div>`}
function operations(){shell("Operations",`<h1 class="title">Operations overview</h1><p class="muted">Owner monitoring · ${period}</p>${tabs()}<div class="grid"><div class="metric"><small>Active shifts</small><strong>3</strong></div><div class="metric"><small>Salesmen active</small><strong>3</strong></div><div class="metric"><small>Pumps online</small><strong class="green">4 / 4</strong></div><div class="metric"><small>Pending issues</small><strong class="amber">2</strong></div></div><div class="card"><h2 style="font-size:15px;margin:0 0 8px">Station status</h2>${row("Current shifts","Salesman A · B · C","Open","green","shifts")}${row("Pump network","All machines connected","Normal","green","pumps")}${row("Meter readings","One variance requires review","Review","amber","pumps")}</div><div class="section">Operations</div>${row("Shift monitoring","Current staff activity","›","","shifts")}${row("Pump & meter monitoring","Machines, readings, variance","›","","pumps")}${row("Expenses","Station operating expenses","›","","expenses")}${row("Other operations","Operational items and adjustments","›","","other")}${row("Exceptions & alerts","Owner attention required","2","amber","alerts")}${row("Audit history","Operational changes","›","","audit")}`)}
function summary(){shell("Summary",`<h1 class="title">Business summary</h1><p class="muted">Owner view · choose a period</p>${tabs()}<div class="grid"><div class="metric"><small>Sales</small><strong>₹4,86,250</strong></div><div class="metric"><small>Volume</small><strong>59,910 L</strong></div><div class="metric"><small>Digital</small><strong>₹2,14,680</strong></div><div class="metric"><small>Credit</small><strong>₹1,28,400</strong></div></div><div class="card"><h2 style="font-size:15px;margin:0 0 8px">Collections</h2><div class="kv"><span>Cash collections</span><b>₹2,71,570</b></div><div class="kv"><span>Digital collections</span><b>₹2,14,680</b></div><div class="kv"><span>Credit sales</span><b>₹1,28,400</b></div></div><button class="outline" onclick="go('home')">Back to home</button>`,"summary")}
function custom(){shell("Custom summary",`<h1 class="title">Custom date range</h1><p class="muted">Select the period you want to monitor</p><div class="card"><div class="section">From date</div><input type="date"><div class="section">To date</div><input type="date"><button class="primary" onclick="period='Custom';current='summary';render()">Apply date range</button></div>`,"summary")}
function simple(title,heading,sub,items,active="home"){shell(title,`<h1 class="title">${heading}</h1><p class="muted">${sub}</p>${items.map(x=>row(...x)).join("")}<button class="outline" onclick="go('home')">Back to home</button>`,active)}
function settings(){shell("Settings",`<h1 class="title">Owner controls</h1><p class="muted">All configurable controls remain under settings</p><div class="section">Module controls</div>${row("Salesman module","Staff workflows","On","green","noop")}${row("Credit customers","Credit workflow","On","green","noop")}${row("Digital transactions","Bank collections","On","green","noop")}${row("Meter readings","Machine readings","On","green","noop")}<div class="section">Permissions</div>${row("Edit permissions","Control role access","›","","permissions")}${row("Lock / disable / enable","Control module availability","›","","controls")}<button class="outline" onclick="go('home')">Back to home</button>`,"settings")}
function noop(){return}
function render(){
if(current==="home")home();
else if(current==="operations")operations();
else if(current==="summary")summary();
else if(current==="custom")custom();
else if(current==="salesmen")simple("Salesmen","Salesmen","Current station activity",[["Salesman A","Shift open · ₹1,82,450","Active","green","noop"],["Salesman B","Shift open · ₹1,54,200","Active","green","noop"],["Salesman C","Shift open · ₹1,49,600","Active","green","noop"]]);
else if(current==="digital")simple("Digital transactions","Digital collections","Owner monitoring · Today",[["Bank collections","Verified transactions","₹2,14,680","","noop"],["Pending review","No unresolved bank mismatch","₹0","green","noop"]]);
else if(current==="credit")simple("Credit customers","Credit customers","Owner monitoring · Today",[["Outstanding","18 active accounts","₹1,28,400","amber","noop"],["Due today","4 customers","₹18,600","amber","noop"],["Overdue","2 customers","₹12,400","red","noop"]]);
else if(current==="pumps")simple("Pump & meter","Pump & meter","Machine monitoring",[["M1","Petrol · 18,420.40 L","0.00 L","green","noop"],["M2","Diesel · 21,845.10 L","1.75 L variance","amber","noop"],["M3","Petrol · 15,208.60 L","0.00 L","green","noop"],["M4","Diesel · 19,436.10 L","0.00 L","green","noop"]]);
else if(current==="shifts")simple("Shift monitoring","Current shifts","Live owner view",[["Salesman A","Started 07:02 AM · Sales ₹1,82,450","Open","green","noop"],["Salesman B","Started 08:14 AM · Sales ₹1,54,200","Open","green","noop"],["Salesman C","Started 09:03 AM · Sales ₹1,49,600","Open","green","noop"]]);
else if(current==="expenses")simple("Expenses","Expense overview","Owner monitoring · Today",[["Station maintenance","Approved","₹4,500","","noop"],["Cleaning & supplies","Approved","₹2,100","","noop"],["Utilities","Approved","₹3,000","","noop"],["Other operations","Pending","₹2,850","amber","noop"]]);
else if(current==="other")simple("Other operations","Other operations","Owner monitoring",[["Station issue","Canopy light inspection","Open","amber","noop"],["Stock check","Lubricants reviewed","Completed","green","noop"],["Operational adjustment","Price board update","Completed","green","noop"]]);
else if(current==="alerts")simple("Exceptions & alerts","Owner attention","Items requiring review",[["Meter variance","M2 · 1.75 L","Review","amber","noop"],["Credit overdue","2 customers · ₹12,400","Review","red","noop"]]);
else if(current==="audit")simple("Audit history","Recent activity","Owner audit trail",[["Meter reading recorded","27 Aug · M2","Review","","noop"],["Salesman shift started","27 Aug · Salesman C","Recorded","","noop"],["Credit transaction added","27 Aug · Customer account","Recorded","","noop"]]);
else if(current==="settings")settings();
else if(current==="permissions")simple("Permissions","Edit permissions","Owner controlled",[["Manager access","Operational monitoring","Allowed","green","noop"],["Salesman access","Assigned workflows","Allowed","green","noop"],["Financial controls","Owner-only controls","Restricted","amber","noop"]],"settings");
else if(current==="controls")simple("Module controls","Availability controls","Enable, disable or lock modules",[["Salesman module","Available to staff","Enabled","green","noop"],["Credit customers","Available to staff","Enabled","green","noop"],["Digital transactions","Available to staff","Enabled","green","noop"],["Meter readings","Available to staff","Enabled","green","noop"]],"settings");
else if(current==="profile")simple("Profile","Owner profile","Account information",[["Role","Owner","Owner","","noop"],["Station","Asian Filling Station","Active","green","noop"]],"profile");
else home();
}
render();
})();
</script>
</body>
</html>
