<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063f4b">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PumpOS">
<title>PumpOS — Salesman Module</title>
<style>
:root{
  --navy:#063f4b;--navy2:#052f38;--blue:#1257c8;--green:#159447;
  --bg:#f5f7f8;--card:#fff;--line:#d9e3e7;--text:#132027;--muted:#68777e;
  --soft:#eef3f5;--warning:#fff7e6;--warningText:#765716;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e8edef;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{width:100%;max-width:390px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.header{
  height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:30
}
.header .brand{font-weight:800;letter-spacing:.2px}
.header .back,.header .bell{width:28px;text-align:center;font-size:22px;cursor:pointer}
.main{padding:16px 14px 94px;min-height:calc(100vh - 58px);overflow-y:auto}
.title{font-size:20px;line-height:1.2;font-weight:800;margin:0 0 5px}
.sub{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;
  margin:9px 0;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:60px
}
.item .grow{flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.radio{font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:112px;
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-weight:800;cursor:pointer
}
.tile .tileicon{font-size:29px;margin-bottom:8px}
.tile small{font-size:10px;color:var(--muted);margin-top:5px}
.btn{
  width:100%;border:0;border-radius:11px;padding:13px;margin-top:9px;background:var(--navy);
  color:#fff;font-weight:800;font-size:13px;cursor:pointer;min-height:46px
}
.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}
.btn.light{background:#fff;color:var(--navy);border:1px solid #b8cbd1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,.select{
  width:100%;height:45px;border:1px solid #cbd8dd;border-radius:10px;background:#fff;
  padding:0 11px;margin:5px 0 11px;color:var(--text)
}
.input:focus,.select:focus{outline:2px solid #b9cff5;outline-offset:1px}
.label{display:block;font-size:11px;font-weight:800;margin-top:5px}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
.row{
  display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f2;
  font-size:12px;min-width:0
}
.row:last-child{border-bottom:0}.row .value{font-weight:800;text-align:right;overflow-wrap:anywhere}
.success{text-align:center;padding:30px 8px 18px}
.check{
  width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:45px;
  display:grid;place-items:center;margin:0 auto 14px
}
.success h2{font-size:19px;margin:0 0 7px}.success p{font-size:12px;color:var(--muted)}
.count{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.count strong{font-size:23px;margin-top:3px}.count small{font-size:10px}
.homehead{display:flex;justify-content:space-between;gap:10px}
.homeleft{min-width:0}.homeleft h1{margin-bottom:4px}.active{color:var(--green);font-weight:800;font-size:12px}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);
  min-height:68px;background:#fff;border-top:1px solid #d9e2e6;display:grid;grid-template-columns:repeat(4,1fr);
  z-index:40;padding-bottom:env(safe-area-inset-bottom)
}
.nav button{
  border:0;background:#fff;color:#66757d;font-size:9px;font-weight:800;padding:5px 2px;cursor:pointer
}
.nav button.active{color:var(--blue)}.nav span{display:block;font-size:18px;margin-bottom:3px}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:15px}
.step{font-size:8px;text-align:center;color:#6d7a80;line-height:1.15}
.dot{
  width:24px;height:24px;border-radius:50%;border:1px solid #c7d3d8;background:#fff;
  display:grid;place-items:center;margin:0 auto 4px;font-weight:800
}
.step.done .dot{background:var(--green);color:#fff;border-color:var(--green)}
.step.current .dot{background:var(--blue);color:#fff;border-color:var(--blue)}
.totalCard{
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;text-align:center;margin:10px 0
}
.totalCard .label2{font-size:12px;font-weight:800}.totalCard strong{display:block;color:var(--green);font-size:23px;margin-top:5px}
.toast{
  background:#edf8f0;border:1px solid #cfe8d6;color:#176c38;border-radius:11px;padding:10px;
  font-size:11px;margin-top:10px
}
.lock{background:var(--warning);border:1px solid #f1ddb0;color:var(--warningText);border-radius:11px;padding:10px;font-size:11px;margin-top:10px}
.section-title{font-size:13px;font-weight:800;margin:16px 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin-top:0}
.choice{
  border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;margin:8px 0;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer
}
.choice.selected{border-color:#9bb7ea;box-shadow:0 0 0 1px #9bb7ea inset}
.choice .left{display:flex;align-items:center;gap:10px}.choice .fuelIcon{font-size:22px}
.review-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.review-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px;border-bottom:1px solid #edf1f2;font-size:12px}
.review-row:last-child{border-bottom:0}.review-row strong{text-align:right}
.muted-box{background:var(--soft);border-radius:11px;padding:12px;font-size:11px;color:#44545b}
.search-wrap{position:relative}.search-wrap .input{padding-right:40px}.searchIcon{position:absolute;right:13px;top:16px}
.status-ok{color:var(--green);font-weight:800}.status-pending{color:#c97800;font-weight:800}
.meter-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}
.meter-card h3{margin:0 0 9px;font-size:13px}
.small-note{font-size:10px;color:var(--muted)}
.home-logo{
  width:42px;height:42px;border-radius:12px;background:#eaf6ee;display:grid;place-items:center;
  color:var(--green);font-size:22px;font-weight:900
}
.logout{color:#c62828!important}
.hidden{display:none!important}
@media(max-width:350px){.title{font-size:18px}.main{padding-left:11px;padding-right:11px}}
</style>

}
button,input,select{font:inherit}
button{

}
input,select{

h1,h2,h3,.title{letter-spacing:-.02em}
.small,.sub,.muted{line-height:1.45}
@media(max-width:420px){
  .page,.screen,.container{max-width:390px!important}
}
</style>


<style id="pumpos-owner-premium-v2">
:root{
  --po-deep:#073b46;
  --po-ink:#14272d;
  --po-muted:#708087;
  --po-line:#e5ecee;
  --po-bg:#f5f8f8;

body{

}
*{box-sizing:border-box}

<body>
<div id="appBoot" style="position:fixed;inset:0;background:#063f4b;color:#fff;display:grid;place-items:center;z-index:200;font:800 14px Arial">PumpOS</div>
<div class="app" id="app"></div>

<script>
/* PumpOS Salesman Module — Complete Re-Corrected Prototype */

let screen="login";
let flow="normal";
let selectedCustomer=null;
let selectedFuel="Petrol";
let selectedNozzle="N1 — Petrol";
let amount=1052.00;
let rate=105.20;
let quantity=10.00;

const customers=[
  ["AT","Aarun Traders","CUS1001","₹37,550.00","₹12,450.00"],
  ["SS","ShaktiKiran Store","CUS1002","₹25,000.00","₹8,250.00"],
  ["RE","Raju Enterprises","CUS1003","₹42,100.00","₹5,600.00"],
  ["MM","Modern Market","CUS1004","₹31,500.00","₹9,850.00"],
  ["GA","Grocery Agency","CUS1005","₹28,900.00","₹7,250.00"],
  ["WC","White Corneral Store","CUS1006","₹22,500.00","₹4,800.00"]
];

const navNames={
  home:"Home",shift:"Shift Status",close:"Close Shift",profile:"Profile",
  credit:"Credit Customers",digital:"Digital Transactions",operations:"Operations",summary:"Summary"
};
const navIcons={home:"⌂",shift:"◷",close:"▣",profile:"♙",credit:"♙",digital:"▣",operations:"⚙",summary:"◔"};

function contextualNav(){
  let items;
  if(flow==="credit") items=["home","digital","operations","summary"];
  else if(flow==="digital") items=["home","credit","operations","summary"];
  else if(flow==="operations") items=["home","credit","digital","summary"];
  else if(flow==="summary") items=["home","credit","digital","operations"];
  else items=["home","shift","close","profile"];
  return `<div class="nav">${items.map(x=>`
    <button class="${x===flow?'active':''}" onclick="navigate('${x}')">
      <span>${navIcons[x]}</span>${navNames[x]}
    </button>`).join("")}</div>`;
}

function header(title="PumpOS"){
  return `<div class="header">
    <span class="back" onclick="goBack()">‹</span>
    <span class="brand">⛽ ${title}</span>
    <span class="bell">♧</span>
  </div>`;
}

function shell(body,title="PumpOS",showNav=true){
  document.getElementById("app").innerHTML=header(title)+`<main class="main">${body}</main>`+(showNav?contextualNav():"");
}

function button(text,action,cls=""){return `<button class="btn ${cls}" onclick="${action}">${text}</button>`}

function rows(list){
  return list.map(x=>`<div class="row"><span>${x[0]}</span><span class="value">${x[1]}</span></div>`).join("");
}

function navigate(target){
  flow=target==="home"?"normal":target;
  screen=target==="home"?"home":({
    credit:"credit",digital:"digital",operations:"operations",summary:"summary",
    shift:"shiftStatus",close:"close",profile:"profile"
  }[target]||target);
  render();
}

function goBack(){
  const homeish=["home","credit","digital","operations","summary","shiftStatus","close","profile"];
  if(screen==="home"||homeish.includes(screen)) return;
  if(["cstatus","cfuel","cqty","creview","cout","csuccess","addCustomer"].includes(screen)) return navigate("credit");
  if(["dreview","dconfirm","dsuccess","dlist"].includes(screen)) return navigate("digital");
  if(["nat","expenses","others","opsuccess"].includes(screen)) return navigate("operations");
  if(screen==="meters"||screen==="collection") return navigate("summary");
  if(["shiftStart","machine","opening","verify","started"].includes(screen)) return screen==="shiftStart"?render():navigate("home");
}

function showToast(message, type="ok"){
  let t=document.getElementById("globalToast");
  if(!t){
    t=document.createElement("div");
    t.id="globalToast";
    t.style.cssText="position:fixed;left:50%;bottom:82px;transform:translateX(-50%);width:min(360px,calc(100% - 28px));z-index:100;background:#123f48;color:#fff;padding:12px 14px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.18);opacity:0;transition:opacity .18s";
    document.body.appendChild(t);
  }
  t.textContent=message;
  t.style.background=type==="warn" ? "#7a5a16" : "#123f48";
  t.style.opacity="1";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.style.opacity="0",2200);
}
function confirmAction(message, onYes){
  let old=document.getElementById("confirmOverlay"); if(old) old.remove();
  const o=document.createElement("div");
  o.id="confirmOverlay";
  o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;display:grid;place-items:end center;padding:14px";
  o.innerHTML=`<div style="width:min(390px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 15px 50px rgba(0,0,0,.25)">
    <div style="font-size:16px;font-weight:800;margin-bottom:8px">Confirm Action</div>
    <div style="font-size:12px;color:#68777e;line-height:1.5">${message}</div>
    <div class="two" style="margin-top:15px">
      <button class="btn light" id="cancelConfirm">Cancel</button>
      <button class="btn green" id="yesConfirm">Confirm</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  document.getElementById("cancelConfirm").onclick=()=>o.remove();
  document.getElementById("yesConfirm").onclick=()=>{o.remove();onYes()};
}

function render(){const boot=document.getElementById("appBoot");if(boot)boot.remove();
  switch(screen){
    case "login": return login();
    case "shiftStart": return selectShift();
    case "machine": return selectMachine();
    case "opening": return openingMeter();
    case "verify": return verifyOpening();
    case "started": return shiftStarted();
    case "home": return home();
    case "credit": return creditList();
    case "addCustomer": return addCustomer();
    case "cstatus": return customerOverview();
    case "cfuel": return fuelNozzle();
    case "cqty": return creditAmount();
    case "creview": return creditReview();
    case "cout": return newOutstanding();
    case "csuccess": return creditSuccess();
    case "digital": return digitalEntry();
    case "dreview": return digitalReview();
    case "dconfirm": return digitalConfirm();
    case "dsuccess": return digitalSuccess();
    case "dlist": return digitalList();
    case "operations": return operations();
    case "nat": return nat();
    case "expenses": return expenses();
    case "others": return others();
    case "opsuccess": return operationSuccess();
    case "summary": return summary();
    case "meters": return meters();
    case "collection": return collectionDetails();
    case "shiftStatus": return shiftStatus();
    case "close": return closeShift();
    case "profile": return profile();
  }
}

/* LOGIN + SHIFT START */

function login(){
  shell(`
    <div style="background:#082f73;color:#fff;border-radius:0 0 18px 18px;text-align:center;padding:25px 12px 30px">
      <div style="font-size:52px">⛽</div>
      <div style="font-size:28px;font-weight:900;letter-spacing:1px">ASIAN</div>
      <div style="font-weight:800">FILLING STATION</div>
      <div style="margin-top:5px;opacity:.9">Fueling Trust</div>
    </div>
    <div class="card">
      <h1 class="title" style="text-align:center">Login</h1>
      <div class="two">
        <button class="btn blue" type="button">Owner</button>
        <button class="btn light" type="button">Manager</button>
      </div>
      <div style="height:2px"></div>
      <label class="label">User ID</label>
      <input class="input" placeholder="User ID" value="SALEEM01">
      <label class="label">Password</label>
      <input class="input" type="password" placeholder="Password" value="123456">
      <label style="font-size:11px"><input type="checkbox"> Remember Me</label>
      ${button("Login","screen='shiftStart';render()","blue")}
      <div style="text-align:center;font-size:28px;color:#1257c8;margin-top:14px">◉</div>
    </div>`,`Asian Filling Station`,false);
}

function progress(current){
  const labels=["Select Shift","Select Machine","Opening Meter","Verify Opening","Shift Started"];
  return `<div class="progress">${labels.map((x,i)=>{
    const n=i+1,cls=n<current?"done":n===current?"current":"";
    return `<div class="step ${cls}"><div class="dot">${n<current?"✓":n}</div>${x}</div>`;
  }).join("")}</div>`;
}

function selectShift(){
  shell(progress(1)+`
    <h1 class="title">Select Shift</h1>
    <p class="sub">Choose Your Shift Type to Start the Day.</p>
    ${[
      ["24 Hours Shift","Full Day 24 Hours"],
      ["12 Hours Shift","Custom 12 Hours"],
      ["Morning Shift","06:00 AM – 02:00 PM"],
      ["Evening Shift","02:00 PM – 10:00 PM"],
      ["Night Shift","10:00 PM – 06:00 AM"]
    ].map((x,i)=>`
      <div class="item ${i===0?'selected':''}" onclick="selectShiftUI(this)">
        <span class="radio">${i===0?'◉':'○'}</span>
        <div class="grow"><b>${x[0]}</b><small>${x[1]}</small></div>
      </div>`).join("")}
    ${button("Next","screen='machine';render()","blue")}
  `,"PumpOS",false);
}

function selectShiftUI(el){
  document.querySelectorAll(".item").forEach(x=>{x.classList.remove("selected");x.querySelector(".radio").textContent="○"});
  el.classList.add("selected");el.querySelector(".radio").textContent="◉";
}

function selectMachine(){
  shell(progress(2)+`
    <h1 class="title">Select Machine</h1>
    <p class="sub">Choose the Machine You Will Operate.</p>
    ${[
      ["M1","Petrol","2 Nozzles"],["M2","Petrol","2 Nozzles"],
      ["M3","Diesel","2 Nozzles"],["M4","Diesel","2 Nozzles"]
    ].map((x,i)=>`
      <div class="item" onclick="selectMachineUI(this)">
        <span style="font-size:21px">⛽</span>
        <div class="grow"><b>${x[0]} — ${x[1]}</b><small>${x[2]} • Active</small></div>
        <span class="radio">${i===0?'◉':'○'}</span>
      </div>`).join("")}
    ${button("Next","screen='opening';render()","blue")}
  `,"PumpOS",false);
}
function selectMachineUI(el){
  document.querySelectorAll(".item").forEach(x=>{x.classList.remove("selected");x.querySelector(".radio").textContent="○"});
  el.classList.add("selected");el.querySelector(".radio").textContent="◉";
}

function openingMeter(){
  shell(progress(3)+`
    <h1 class="title">Opening Meter</h1>
    <p class="sub">Opening Meter Is Auto-Filled From Last Closing.</p>
    <div class="card">${rows([
      ["Machine","M1 — Petrol"],
      ["Nozzle","N1 — Petrol"],
      ["Opening Meter","10,000.00 L"],
      ["Opening Meter Time","27 Aug 2026, 09:00 AM"]
    ])}</div>
    <div class="toast">Opening Meter Is Taken From the Last Closing of This Nozzle.</div>
    ${button("Next","screen='verify';render()","blue")}
  `,"PumpOS",false);
}

function verifyOpening(){
  shell(progress(4)+`
    <h1 class="title">Verify Opening</h1>
    <p class="sub">Please Verify All Details Before Starting the Shift.</p>
    <div class="card">${rows([
      ["Shift Type","24 Hours Shift"],
      ["Machine","M1 — Petrol"],
      ["Nozzle","N1 — Petrol"],
      ["Opening Meter","10,000.00 L"]
    ])}</div>
    <label style="font-size:11px"><input id="verifyCheck" type="checkbox" checked> I Verify That the Opening Meter Is Correct.</label>
    ${button("Confirm","startAfterVerify()","blue")}
  `,"PumpOS",false);
}
function startAfterVerify(){
  if(!document.getElementById("verifyCheck").checked){showToast('Please Verify the Opening Meter.','warn');return}
  screen="started";render();
}
function shiftStarted(){
  shell(progress(5)+`
    <div class="success"><div class="check">✓</div><h2>Shift Started Successfully!</h2><p>Your Shift Has Been Started.</p></div>
    <div class="card">${rows([
      ["Machine","M1 — Petrol"],["Nozzle","N1 — Petrol"],
      ["Shift Type","24 Hours Shift"],["Start Time","27 Aug 2026, 09:00 AM"]
    ])}</div>
    ${button("Next","screen='home';flow='normal';render()","blue")}
  `,"PumpOS",false);

function customerCards(list){
  if(!list.length) return `<div class="muted-box">No Customer Found.</div>`;
  return list.map(c=>{
    const idx=customers.indexOf(c);
    return `<div class="item" onclick="selectedCustomer=customers[${idx}];screen='cstatus';render()">
      <span style="font-weight:800">${c[0]}</span>
      <div class="grow"><b>${c[1]}</b><small>${c[2]}</small></div><span>›</span>
    </div>`;
  }).join("");
}
function filterCustomers(q){
  const l=customers.filter(c=>(c[1]+" "+c[2]).toLowerCase().includes(q.toLowerCase()));
  document.getElementById("customerList").innerHTML=customerCards(l);
}

function fuelNozzle(){
  shell(`

    <label class="label">Nozzle</label>
    <select class="select" onchange="selectedNozzle=this.value">
      <option>N1 — Petrol</option><option>N2 — Petrol</option>

    </select>
    ${button("Next","screen='cqty';render()","blue")}
  `,"Credit Customers",true);
}
function chooseFuel(fuel,el){
  selectedFuel=fuel;
  document.querySelectorAll(".choice").forEach(x=>{x.classList.remove("selected");x.querySelector(".radio").textContent="○"});
  el.classList.add("selected");el.querySelector(".radio").textContent="◉";
  const s=document.querySelector(".select");
  if(fuel==="Diesel"){s.innerHTML="<option>N3 — Diesel</option><option>N4 — Diesel</option>"}
  else if(fuel==="Power"){s.innerHTML="<option>N5 — Power</option>"}
  else{s.innerHTML="<option>N1 — Petrol</option><option>N2 — Petrol</option>"}
  selectedNozzle=s.value;
}

function recalcFromAmount(){
  const a=parseFloat(document.getElementById("amount").value);
  amount=isFinite(a)?a:0;
  quantity=rate?amount/rate:0;
  document.getElementById("quantity").value=quantity.toFixed(2);
}
function recalcFromQuantity(){
  const q=parseFloat(document.getElementById("quantity").value);
  quantity=isFinite(q)?q:0;
  amount=quantity*rate;
  document.getElementById("amount").value=amount.toFixed(2);
}

    <input class="input" value="${rate.toFixed(2)}" readonly>
    <label class="label">Quantity (L)</label>
