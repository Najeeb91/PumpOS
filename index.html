<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PumpOS Owner — Sales Monitoring</title>
<style>
:root{--bg:#F8F7F2;--n:#1a2332;--g:#5FA83E;--s:#5a6472;--l:#e5e3da;--w:#fff;--a:#b87931}
*{box-sizing:border-box}body{margin:0;background:#e7e5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:var(--n)}
.app{max-width:390px;min-height:100vh;margin:auto;background:var(--bg)}.screen{min-height:100vh;padding-bottom:84px}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--l);background:#faf9f5;position:sticky;top:0;z-index:5}
header b{font-size:17px}header button{border:0;background:none;font-size:22px;color:var(--n)}
main{padding:18px 16px}h1{font-size:25px;margin:0 0 5px;font-weight:800}h2{font-size:16px;margin:0}.sub{font-size:11px;color:var(--s);margin:0;line-height:1.5}
.period{display:flex;gap:6px;margin:14px 0;overflow:auto}.period button{background:#fff;border:1px solid var(--l);border-radius:10px;padding:8px 11px;font-size:10px;font-weight:750;white-space:nowrap}.period .on{background:var(--n);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.card,.row,.filter{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 2px 10px #1a23320a}.metric{padding:13px}.metric small{font-size:10px;color:var(--s)}.metric strong{display:block;font-size:17px;margin-top:5px}.green{color:var(--g)}
.card{padding:14px;margin-top:12px}.section{font-size:12px;font-weight:800;margin:18px 0 8px}.row{padding:11px 12px;margin:8px 0;font-size:11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.row small{display:block;color:var(--s);font-size:9px;margin-top:3px}.row strong{text-align:right}.bar{height:7px;background:#eeeDE8;border-radius:20px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:20px}.filter{padding:12px;margin-top:12px}.select{width:100%;height:42px;border:1px solid var(--l);border-radius:11px;background:#fff;padding:0 10px;color:var(--n);font-size:11px;margin-top:7px}
.btn{width:100%;height:48px;border-radius:13px;margin-top:10px;font-weight:800}.primary{background:var(--g);color:#fff;border:0}.outline{background:#fff;color:var(--n);border:1px solid #aeb4b2}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);height:78px;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{border:0;background:#fff;color:#69727c;font-size:8px;font-weight:750}.nav span{display:block;font-size:17px;line-height:22px}.nav .on{color:var(--g)}
.badge{font-size:9px;padding:4px 7px;border-radius:8px;background:#f0f7ed;color:var(--g);font-weight:800}.detail{font-size:11px;line-height:1.7}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #f0eee8;padding:9px 0}.kv:last-child{border-bottom:0}
</style></head><body><div class="app" id="app"></div>
<script>
let page="sales",period="Today",filter="All Sales";
const periods=["Today","This Week","This Month","Custom"];
const nav=[["home","⌂","Home"],["reports","▥","Reports"],["alerts","!","Alerts"],["settings","⚙","Settings"],["profile","♙","Profile"]];
const data={Today:["₹4,86,250.00","4,386.70 L","1,248","₹2,12,450","₹1,86,300","₹87,500"],"This Week":["₹21,84,500.00","19,840.40 L","5,712","₹9,12,800","₹8,31,200","₹4,40,500"],"This Month":["₹82,46,500.00","74,910.20 L","21,436","₹34,82,450","₹31,20,300","₹16,43,750"]};
function shell(title,body){document.getElementById("app").innerHTML=`<div class="screen"><header><button onclick="go('home')">‹</button><b>${title}</b><button>♙</button></header><main>${body}</main></div><nav class="nav">${nav.map(x=>`<button class="${x[0]=="home"?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`}
function go(x){if(x=="home"){location.href="index.html";return} if(["reports","alerts","settings","profile"].includes(x)){alert("Owner navigation remains available from the main Owner prototype.");return}}
function tabs(){return`<div class="period">${periods.map(x=>`<button class="${period==x?"on":""}" onclick="${x=="Custom"?"custom()":"period='"+x+"';render()"}">${x}</button>`).join("")}</div>`}
function custom(){shell("Sales",`<h1>Custom Sales</h1><p class="sub">Select A Date Range</p><div class="card"><b class="section">From Date</b><input class="select" type="date"><b class="section">To Date</b><input class="select" type="date"><button class="btn primary" onclick="period='Custom';renderCustom()">Apply Date Range</button></div>`)}
function renderCustom(){shell("Sales",`<h1>Sales Overview</h1><p class="sub">01 Aug 2026 – 27 Aug 2026</p><div class="grid"><div class="metric"><small>Total Sales</small><strong class="green">₹74,28,650</strong></div><div class="metric"><small>Fuel Volume</small><strong>67,420.50 L</strong></div><div class="metric"><small>Transactions</small><strong>19,982</strong></div><div class="metric"><small>Credit Sales</small><strong>₹14,59,450</strong></div></div><button class="btn outline" onclick="render()">Change Date Range</button>`)}
function render(){let d=data[period]||data.Today;shell("Sales",`<h1>Sales Overview</h1><p class="sub">Owner Monitoring · ${period}</p>${tabs()}<div class="grid"><div class="metric"><small>Total Sales</small><strong class="green">${d[0]}</strong></div><div class="metric"><small>Fuel Volume</small><strong>${d[1]}</strong></div><div class="metric"><small>Transactions</small><strong>${d[2]}</strong></div><div class="metric"><small>Average Sale</small><strong>₹389.30</strong></div></div>
<div class="card"><h2>Payment Mix</h2><div class="row"><span>Cash<small>43.7% of Sales</small></span><strong>${d[3]}</strong></div><div class="bar"><i style="width:44%"></i></div><div class="row"><span>Digital<small>38.3% of Sales</small></span><strong>${d[4]}</strong></div><div class="bar"><i style="width:38%"></i></div><div class="row"><span>Credit<small>18.0% of Sales</small></span><strong>${d[5]}</strong></div><div class="bar"><i style="width:18%"></i></div></div>
<div class="section">Sales Breakdown</div><div class="row" onclick="breakdown('Fuel')"><span>Fuel<small>Petrol · Diesel</small></span><strong>›</strong></div><div class="row" onclick="breakdown('Machine')"><span>Machine-wise Sales<small>M1 · M2 · M3 · M4</small></span><strong>›</strong></div><div class="row" onclick="breakdown('Nozzle')"><span>Nozzle-wise Sales<small>All Active Nozzles</small></span><strong>›</strong></div><div class="row" onclick="breakdown('Salesman')"><span>Salesman-wise Sales<small>Performance Overview</small></span><strong>›</strong></div>
<div class="section">Transactions</div><div class="filter"><b style="font-size:11px">Filter Transactions</b><select class="select" onchange="filter=this.value;list()"><option>All Sales</option><option>Cash</option><option>Digital</option><option>Credit</option></select></div><div id="tx"></div>`);list()}
function list(){let el=document.getElementById("tx");if(!el)return;el.innerHTML=["10:42 AM · ₹2,450 · Diesel","10:38 AM · ₹1,800 · Petrol","10:31 AM · ₹3,200 · Diesel","10:24 AM · ₹1,250 · Petrol"].map((x,i)=>`<div class="row" onclick="transaction(${i})"><span>${x}<small>${filter} · Salesman ${i%2?"B":"A"} · M${(i%4)+1}</small></span><strong class="badge">Recorded</strong></div>`).join("")}
function transaction(i){shell("Transaction Details",`<h1>Transaction Details</h1><p class="sub">Recorded Sale · Today</p><div class="card detail">${[["Time","10:42 AM"],["Amount","₹2,450.00"],["Fuel","Diesel"],["Quantity","24.50 L"],["Rate","₹100.00 / L"],["Machine","M1"],["Nozzle","N2"],["Salesman","Salesman A"],["Payment","Cash"],["Status","Recorded"]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><button class="btn outline" onclick="render()">Back to Sales</button>`)}
function breakdown(t){shell(t+" Sales",`<h1>${t}-wise Sales</h1><p class="sub">Owner Monitoring · ${period}</p><div class="card">${(t=="Fuel"?["Petrol","Diesel"]:t=="Machine"?["M1","M2","M3","M4"]:t=="Nozzle"?["N1","N2","N3","N4","N5","N6"]:["Salesman A","Salesman B","Salesman C"]).map((x,i)=>`<div class="row"><span>${x}<small>${t=="Fuel"?"Volume & Sales":"Sales Performance"}</small></span><strong>${["₹1,84,250","₹3,02,000","₹1,22,450","₹98,300","₹87,650","₹91,600"][i]||"₹74,250"}</strong></div>`).join("")}</div><button class="btn outline" onclick="render()">Back to Sales</button>`)}
render();
</script></body></html>
