<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PumpOS Owner — Credit Customers</title>
<style>
:root{--bg:#F8F7F2;--n:#1a2332;--g:#5FA83E;--s:#5a6472;--l:#e5e3da;--w:#fff;--a:#b87931;--r:#b94b43}
*{box-sizing:border-box}body{margin:0;background:#e7e5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:var(--n)}
.app{max-width:390px;min-height:100vh;margin:auto;background:var(--bg)}.screen{min-height:100vh;padding-bottom:84px}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--l);background:#faf9f5;position:sticky;top:0;z-index:5}
header b{font-size:17px}header button{border:0;background:none;font-size:22px;color:var(--n)}
main{padding:18px 16px}h1{font-size:25px;margin:0 0 5px;font-weight:800}h2{font-size:16px;margin:0}.sub{font-size:11px;color:var(--s);margin:0;line-height:1.5}
.tabs{display:flex;gap:6px;margin:14px 0;overflow:auto}.tabs button{background:#fff;border:1px solid var(--l);border-radius:10px;padding:8px 11px;font-size:10px;font-weight:750;white-space:nowrap}.tabs .on{background:var(--n);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.card,.row,.search{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 2px 10px #1a23320a}.metric{padding:13px}.metric small{font-size:10px;color:var(--s)}.metric strong{display:block;font-size:17px;margin-top:5px}.green{color:var(--g)}.warn{color:var(--a)}.red{color:var(--r)}
.card{padding:14px;margin-top:12px}.section{font-size:12px;font-weight:800;margin:18px 0 8px}.row{padding:11px 12px;margin:8px 0;font-size:11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.row small{display:block;color:var(--s);font-size:9px;margin-top:3px}.row strong{text-align:right}
.search{display:flex;align-items:center;padding:0 12px;height:46px;margin-top:13px}.search input{border:0;outline:0;width:100%;font-size:12px;background:transparent;margin-left:8px}
.badge{font-size:9px;padding:4px 7px;border-radius:8px;background:#f0f7ed;color:var(--g);font-weight:800}.badge.warn{background:#fff7ec;color:var(--a)}.badge.red{background:#fff1ef;color:var(--r)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0eee8;font-size:11px}.kv:last-child{border:0}
.btn{width:100%;height:48px;border-radius:13px;margin-top:10px;font-weight:800}.primary{background:var(--g);color:#fff;border:0}.outline{background:#fff;color:var(--n);border:1px solid #aeb4b2}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);height:78px;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{border:0;background:#fff;color:#69727c;font-size:8px;font-weight:750}.nav span{display:block;font-size:17px;line-height:22px}.nav .on{color:var(--g)}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
let page="overview",tab="Today";
const nav=[["home","⌂","Home"],["reports","▥","Reports"],["alerts","!","Alerts"],["settings","⚙","Settings"],["profile","♙","Profile"]];

function navBar(){return '<nav class="nav">'+nav.map(x=>`<button class="${x[0]=="home"?"on":""}" onclick="home()"><span>${x[1]}</span>${x[2]}</button>`).join("")+'</nav>'}
function shell(title,body){document.getElementById("app").innerHTML=`<div class="screen"><header><button onclick="home()">‹</button><b>${title}</b><button>♙</button></header><main>${body}</main></div>${navBar()}`}
function home(){location.href="index.html"}
function tabs(){return '<div class="tabs">'+["Today","This Week","This Month"].map(x=>`<button class="${tab==x?"on":""}" onclick="tab='${x}';render()">${x}</button>`).join("")+'</div>'}
function render(){
 if(page=="overview")overview();
 if(page=="list")list();
 if(page=="customer")customer();
 if(page=="ledger")ledger();
 if(page=="controls")controls();
 if(page=="audit")audit();
}
function overview(){shell("Credit Customers",`
<h1>Credit Overview</h1><p class="sub">Owner Monitoring · ${tab}</p>${tabs()}
<div class="grid">
<div class="metric"><small>Total Outstanding</small><strong class="red">₹16,43,750</strong></div>
<div class="metric"><small>Today's Credit</small><strong>₹87,500</strong></div>
<div class="metric"><small>Overdue Amount</small><strong class="warn">₹2,18,400</strong></div>
<div class="metric"><small>Active Customers</small><strong>38</strong></div>
</div>
<div class="card"><h2>Credit Health</h2>
<div class="row"><span>Within Limit<small>34 Customers</small></span><strong class="green">89%</strong></div>
<div class="row"><span>Near Limit<small>2 Customers</small></span><strong class="warn">5%</strong></div>
<div class="row"><span>Over Limit<small>2 Customers</small></span><strong class="red">6%</strong></div>
</div>
<div class="section">Customers</div>
<div class="search">⌕<input placeholder="Search Customer" onclick="page='list';render()"></div>
<div class="row" onclick="page='list';render()"><span>View All Customers<small>38 Active Credit Customers</small></span><strong>›</strong></div>
<div class="section">Owner Attention</div>
<div class="row" onclick="page='customer';render()"><span>Arun Traders<small>Outstanding ₹74,800 · Limit ₹70,000</small></span><strong class="red">Over Limit</strong></div>`)}
function list(){shell("Credit Customers",`
<h1>Customer List</h1><p class="sub">Search And Monitor Credit Accounts</p>
<div class="search">⌕<input placeholder="Search Customer"></div>
<div class="section">Active Customers</div>
${[["Arun Traders","₹74,800","₹70,000","Over Limit"],["Khan Auto Parts","₹42,500","₹75,000","Within Limit"],["Sharma Transport","₹68,200","₹80,000","Within Limit"],["Metro Logistics","₹91,450","₹1,00,000","Near Limit"],["Royal Transport","₹24,600","₹50,000","Within Limit"]].map(x=>`
<div class="row" onclick="page='customer';render()"><span>${x[0]}<small>Outstanding ${x[1]} · Limit ${x[2]}</small></span>
<strong class="${x[3]=='Over Limit'?'red':x[3]=='Near Limit'?'warn':'green'}">${x[3]}</strong></div>`).join("")}`)}
function customer(){shell("Customer Overview",`
<h1>Arun Traders</h1><p class="sub">Credit Account · Active</p>
<div class="grid">
<div class="metric"><small>Outstanding</small><strong class="red">₹74,800</strong></div>
<div class="metric"><small>Credit Limit</small><strong>₹70,000</strong></div>
<div class="metric"><small>Available</small><strong class="red">−₹4,800</strong></div>
<div class="metric"><small>Last Payment</small><strong>₹20,000</strong></div>
</div>
<div class="card">
<div class="kv"><span>Last Transaction</span><b>27 Aug · ₹6,250</b></div>
<div class="kv"><span>Last Payment</span><b>24 Aug · ₹20,000</b></div>
<div class="kv"><span>Credit Status</span><b class="red">Over Limit</b></div>
</div>
<div class="section">Account</div>
<div class="row" onclick="page='ledger';render()"><span>Complete Credit Ledger<small>Credit Sales And Payments</small></span><strong>›</strong></div>
<div class="row" onclick="page='controls';render()"><span>Credit Limit & Status<small>Owner Controls</small></span><strong>›</strong></div>
<div class="row" onclick="page='audit';render()"><span>Audit History<small>Changes And Approvals</small></span><strong>›</strong></div>
<button class="btn outline" onclick="page='list';render()">Back to Customers</button>`)}
function ledger(){shell("Credit Ledger",`
<h1>Arun Traders</h1><p class="sub">Complete Credit Ledger</p>
<div class="card">
<div class="kv"><span>Opening Outstanding</span><b>₹68,550</b></div>
<div class="kv"><span>Credit Sales</span><b>₹26,250</b></div>
<div class="kv"><span>Payments</span><b class="green">−₹20,000</b></div>
<div class="kv"><span>Current Outstanding</span><b class="red">₹74,800</b></div>
</div>
<div class="section">Recent Entries</div>
${[["27 Aug · Credit Sale","Diesel · 62.50 L · Salesman A","₹6,250"],["26 Aug · Credit Sale","Petrol · 35.00 L · Salesman B","₹3,500"],["24 Aug · Payment","Recorded By Manager","−₹20,000"],["22 Aug · Credit Sale","Diesel · 72.00 L · Salesman A","₹7,200"],["20 Aug · Credit Sale","Petrol · 41.00 L · Salesman C","₹4,100"]].map(x=>`<div class="row"><span>${x[0]}<small>${x[1]}</small></span><strong>${x[2]}</strong></div>`).join("")}
<button class="btn outline" onclick="page='customer';render()">Back to Customer</button>`)}
function controls(){shell("Credit Controls",`
<h1>Credit Limit & Status</h1><p class="sub">Owner Control · Arun Traders</p>
<div class="card">
<div class="kv"><span>Current Limit</span><b>₹70,000</b></div>
<div class="kv"><span>Outstanding</span><b class="red">₹74,800</b></div>
<div class="kv"><span>Available</span><b class="red">−₹4,800</b></div>
<div class="kv"><span>Credit Status</span><b class="red">Over Limit</b></div>
</div>
<div class="section">Owner Actions</div>
<button class="btn primary" onclick="alert('Credit limit change requires reason, confirmation and an audit record.')">Edit Credit Limit</button>
<button class="btn outline" onclick="alert('Credit account locked. Audit record created.')">Lock Credit</button>
<button class="btn outline" onclick="alert('Credit status disabled. Audit record created.')">Disable Credit</button>
<p style="font-size:9px;color:var(--s);margin-top:10px">Sensitive changes require reason, confirmation and an audit record.</p>
<button class="btn outline" onclick="page='customer';render()">Back to Customer</button>`)}
function audit(){shell("Audit History",`
<h1>Audit History</h1><p class="sub">Arun Traders · Credit Account</p>
${[["27 Aug · 11:24 AM","Credit Sale Recorded","Salesman A · ₹6,250"],["26 Aug · 04:18 PM","Credit Limit Reviewed","Manager · No Change"],["24 Aug · 01:42 PM","Payment Recorded","Manager · ₹20,000"],["20 Aug · 09:12 AM","Credit Account Updated","Owner · Approved"]].map(x=>`<div class="row"><span>${x[0]}<small>${x[1]}</small></span><strong>${x[2]}</strong></div>`).join("")}
<button class="btn outline" onclick="page='customer';render()">Back to Customer</button>`)}
render();
</script></body></html>
